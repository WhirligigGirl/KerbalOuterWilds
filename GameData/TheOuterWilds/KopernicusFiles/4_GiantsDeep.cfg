			description = Giant's Deep is the largest planet in the Outer Wilds, save for the Sun. 8 times more massive than Timber Hearth, and in fact more massive than all the other planets combined, with a crushing surface gravity of 2g, Giant's Deep really lives up to its name, another win for mythological nominative determinism. Giant's Deep is covered in a dense layer of swirling green clouds, so we don't have much of an idea of what its surface is like, or if it even has one. Estimates range from "ice-hydrogen mix" to "rocky planet with small iron core" to "giant ball of pure water." Only one way to find out!  \n\n\n[note from Hornfels: the Sun is not a planet!! >::v]\n[note from Gabbro: it's bright, it moves across the sky, what more do you want? ::P]\n[note from Hornfels: a surface, for one thing!]\n[note from Chert (property of Chert!): Well technically we don't know for sure Giant's Deep HAS a surface.]\n[note from Gabbro: I rest my case. ::)]
