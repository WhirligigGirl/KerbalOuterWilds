		{
			displayName = Dark Bramble^N
			description = Do we really have to talk about this one? This one really gives me the heebie-jeebies. Dark Bramble is the outermost planet in the Outer Wilds. It is a large white sphere that appears to be covered in some manner of dark thorny vines, termed 'brambles.' Sketches from the archives of the great astronomer Edenite Emerald Bournonite with a 5" signalscope seem to indicate that the 'brambles' were thinner and less extensive in the past. \n\nThough photographic evidence to support this is sparse, it isn't a very pleasant thought. It may not actually be the case, but it really says a lot about Dark Bramble that it seemed so believable. Although the nature of the brambles is unknown, the white part can be easily understood as a kind of obscure solidified cryomineral known by geologists as "ice."
			radius = 6720000
			@radius *= 0.25 //quarter scale
			geeASL = 0.593433
			//density = 3.100 g/cm^3
			//mass = 0.66023 M_earth
			rotationPeriod = 68472
			@rotationPeriod *= 0.5
		}
		Orbit
		{
			referenceBody = TOW/Sun
			semiMajorAxis = 149597870700
			@semiMajorAxis *= 0.25 //quarter scale
			@semiMajorAxis *= 0.97597 //timber hearth orbit in earth-au
			@semiMajorAxis *= 2.32745256 //planet orbit / timber hearth orbit
			eccentricity = 0.009
			inclination = 0.74
			meanAnomalyAtEpochD = 100
			argumentOfPeriapsis = 48
			longitudeOfAscendingNode = 2
			color = RGBA(200,200,255,255)
