@principia_gravity_model
{
	body
	{
		name = AshTwin
		axis_declination        = -90 deg
		reference_angle         = 0 deg
	}
}
@Kopernicus:NEEDS[!Principia]
{
	@Body[AshTwin]
	{
		@Properties
		{
			@sphereOfInfluence *= 1.5
		}
		@Orbit
		{
			@semiMajorAxis *= 1.5
		}
	}
	
}
