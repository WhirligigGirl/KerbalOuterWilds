			displayName = Ash Twin^N
			description = The smaller but brighter of the Hourglass Twins. The Ash Twin's high reflectivity is responsible for the Hourglass Twins' name. The periodic brightening and darkening of the double-planet in the sky as one planet eclipsed the other was used as a method of accurately keeping track of time--and thus, longitude--by the explorers who navigated Timber Hearth's deserts prior to the invention of the mechanical clock in antiquity. The bright surface is the subject of some contention among astronomers--its composition is hotly debated. The leading hypothises are white cloud cover, endless salt plains, ice, or plain white sand. The equatorial region of the Ash Twin is a dark gray belt, which is most certainly a mineral known to geologists as 'stone.'\n\n\n\n[Note from Slate: Hornfels wants to know what kind of stone.]\n[Note from Chert: Why don't you get Hornfels to authorize my probe mission study and we can find out.]\n[Note from Slate: We've been over this. The Sky Shutter takes precedent.]
