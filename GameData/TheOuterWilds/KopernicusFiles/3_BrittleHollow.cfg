		{
			name = Duna
			removeAllPQSMods = true
			removeOcean = true
		}
		Properties
		{
			displayName = Brittle Hollow^N
			description = Brittle Hollow is the slightly larger co-hatchling of Timber Hearth, and the nearest planet to us. Its surface looks something like a cracking egg, which gives the planet its name. It has a substantially lower density than Timber Hearth, implying that it is made of just rock with very little iron, or perhaps that it is in fact hollow on the inside.\n\n\n[Note from Feldspar: Isn't the Attlerock the nearest planet to us?]\n[Note from Chert (Property of Chert!): Moons aren't planets.]\n[Note from Hornfels: Moons are indeed planets.]\n[Note from Gossan: Oh no, not this again.]
			radius = 7200000 //20,000x OW scale.
			@radius *= 0.25 //quarter scale
			geeASL = 0.8333
			//density = 4.063 g/cm^3
			//mass = 1.06427 Mearth
			//roche limit = 9134060 = 7200000(2(4.063/3.98))^(1/3)
			
			rotationPeriod = 179513.86583183758 //orbital period of Hollow's Lantern.
			@rotationPeriod *= 2 // (2:7 orbit:spin resonance)
			@rotationPeriod /= 7 // (2:7 orbit:spin resonance)
			@rotationPeriod *= 0.5 //quarter scale
		}
		Orbit
		{
			referenceBody = TOW/Sun
			semiMajorAxis = 149597870700
			@semiMajorAxis *= 0.25 //quarter scale
			@semiMajorAxis *= 0.97597 //timber hearth orbit in earth-au
			@semiMajorAxis *= 1.36049971 //planet orbit / timber hearth orbit
			eccentricity = 0.006
			inclination = 2.1
			meanAnomalyAtEpochD = 55
			argumentOfPeriapsis = 0
			longitudeOfAscendingNode = 0
			color = 0.557692409,0.523076713,0.641478181,0.501960814
			iconTexture = TheOuterWilds/Icons/BrittleHollow.png
		}
