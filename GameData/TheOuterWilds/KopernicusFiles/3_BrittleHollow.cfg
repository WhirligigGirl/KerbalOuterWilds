@Kopernicus:FOR[TheOuterWilds]
{
	Body
	{
		name = BrittleHollow
		cacheFile = TheOuterWilds/KopernicusFiles/Cache/BrittleHollow.bin
		Template
		{
			name = Eve
		}
		Properties
		{
			displayName = Brittle Hollow^N
			radius = 7200000 //20,000x OW scale.
			@radius *= 0.25 //quarter scale
			geeASL = 0.8333
			//density = 4.063 g/cm^3
			//mass = 1.06427 Mearth
			
			rotationPeriod = 86400 //earth solar day.
			@rotationPeriod *= 0.5 //quarter scale.
			@rotationPeriod *= 0.5 //ratio of BH to TH day.
		}
		Orbit
		{
			referenceBody = TOW/Sun
			semiMajorAxis = 149597870700
			@semiMajorAxis *= 0.25 //quarter scale
			@semiMajorAxis *= 0.97597 //timber hearth orbit in earth-au
			@semiMajorAxis *= 1.36049971 //planet orbit / timber hearth orbit
			eccentricity = 0.006
			inclination = 2.1
			meanAnomalyAtEpochD = 55
			argumentOfPeriapsis = 0
			longitudeOfAscendingNode = 0
		}
		PQS
		{
		}
	}
}