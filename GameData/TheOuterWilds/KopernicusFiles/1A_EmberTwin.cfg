@principia_gravity_model
{
	body
	{
		name = EmberTwin
		axis_declination        = -90 deg
		reference_angle         = 0 deg
	}
}
@Kopernicus:FOR[TheOuterWilds]
{
	Body
	{
		name = EmberTwin
		Template
		{
			name = Duna
		}
		Properties
		{
			displayName = Ember Twin^N
			radius = 4800000
			@radius *= 0.25
			geeASL = 0.6667
			//density = 4.87583 g/cm^3
			//mass = 0.378441 mEarth
			//combined mass = 0.378441+0.298546=0.676987 mEarth
			
			rotationPeriod = 15899.8375994706
			@rotationPeriod *= 0.5 //quarter scale.
		}
		Orbit
		{
			referenceBody = TOW/Sun
			semiMajorAxis = 149597870700
			@semiMajorAxis *= 0.25 //quarter scale
			@semiMajorAxis *= 0.97597 //timber hearth orbit in earth-au
			@semiMajorAxis *= 0.58186314 //planet orbit / timber hearth orbit
			eccentricity = 0.082
			inclination = 1.63
			meanAnomalyAtEpochD = 65 //104 deg to ref angle.
			argumentOfPeriapsis = 30
			longitudeOfAscendingNode = 9
			color = RGBA(255,150,100,255)
		}
		PQS
		{
		}
	}
}