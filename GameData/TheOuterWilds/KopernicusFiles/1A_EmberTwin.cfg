			displayName = Ember Twin^N
			description = The Hourglass Twins were once thought to be a single planet, called The Hourglass. It wasn't until the invention of the optical signalscope that the Hourglass was resolved into two components. Historically these were Hourglass-A and Hourglass-B, but in recent times they have been named the Ember Twin and the Ash Twin. The Ember Twin is the larger of these two planets. It is a bright red color, as though it looked at the dull plain deserts of Timber Hearth's highlands and said "I can do better." \n\n\n[Note from Chert (property of Chert!): It's orange, not red.]
