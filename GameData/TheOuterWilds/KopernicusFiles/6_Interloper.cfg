@Kopernicus:FOR[TheOuterWilds]
{
	Body
	{
		name = Interloper
		cacheFile = TheOuterWilds/KopernicusFiles/Cache/Interloper.bin
		Template
		{
			name = Minmus
			removePQSMods = PQSMod_VertexPlanet
		}
		Properties
		{
			displayName = The Interloper^N
			description = The Interloper is a large, persistent, short-period comet--a 'dirty snowball' of sorts, with a tail of ice and rubble trailing behind it. Although it is not unusual for comets to appear from deep space, come near the Sun, and shoot back off into space again, the Interloper is set apart by being much more massive, as well as occupying a retrograde orbit that regularly trespasses on the orbits of the planets. The Interloper's retrograde orbit implies it did not form alongside the other planets and planetoids, and may have originated from outside the Outer Wilds in another solar system. If it indeed arrived at its current position after migrating from interstellar space, it must have occurred relatively recently (on a cosmic scale)--It is close enough to the Sun that all the ices on its surface would have evaporated within just a couple million years.
			
			radius = 64000 //largest comet found in the real solar system.
			@radius *= 0.5 //N.B.: Will scale with the sqrt of the rescale factor! This is because for a given 'relative' size, the smaller planets become minor planet sized at larger and larger relative sizes at smaller and smaller absolute scales.
			rotationPeriod = 65108425.847080946 //orbital period
			@rotationPeriod *= 0.25 //quarter scale
			@rotationPeriod *= 2 //2:5 spin-orbit resonance
			@rotationPeriod /= 5 //2:5 spin-orbit resonance
			@rotationPeriod *= -1 //retrograde
			initialRotation = 100
		}
		Orbit
		{
			referenceBody = TOW/Sun
			semiMajorAxis = 149597870700
			@semiMajorAxis *= 0.25 //quarter scale
			@semiMajorAxis *= 0.97597 //timber hearth orbit in earth-au
			@semiMajorAxis *= 1.54150791 //planet orbit / timber hearth orbit
			eccentricity = 0.8225
			inclination = 187.2
			meanAnomalyAtEpochD = -11
			argumentOfPeriapsis = 180
			longitudeOfAscendingNode = 45
			icon = OBJ_PE_AP
			color = 0.433786064,0.443363279,0.496681571,0.501960814
			iconTexture = TheOuterWilds/Icons/Interloper.png
		}
		ScaledVersion
		{
			Material
			{
				specColor = 0.2,0.25,0.3,1
				color = 1,1,1,1
				shininess = 0.5
			}
			OnDemand
			{
				texture = TheOuterWilds/KopernicusFiles/PluginData/Interloper_Color.png
				normals = TheOuterWilds/KopernicusFiles/PluginData/Interloper_Normal.png
			}
		}
		PQS
		{
			Material
			{
				steepPower = 0.01
			}
			Mods
			{
				VertexMitchellNetravaliHeightMap
				{
					map = TheOuterWilds/KopernicusFiles/PluginData/Interloper_Height.png
					deformity = 64000 //radius
					@deformity *= 0.5 //sqrt of rescale factor
					@deformity *= 1.38787222
					B = 1.6
					C = 0.3
				}
				AltitudeAlpha
				{
					atmosphereDepth = 50000
				}
				VertexHeightMap
				{
					map = TheOuterWilds/KopernicusFiles/PluginData/Interloper_Detail.png
					deformity = 1500
				}
				VertexColorMap
				{
					map = TheOuterWilds/KopernicusFiles/PluginData/Interloper_PQSColor.png
				}
				VertexHeightNoiseRegional
				{
					multiplierMap = TheOuterWilds/KopernicusFiles/PluginData/Interloper_MultiplierMap2.png
					Mod
					{
						deformity = 200
						frequency = 4
						octaves = 6
						persistence = 0.5
						seed = 987
						noiseType = RidgedMultifractal
						mode = High
						lacunarity = 1.2
						order = 100
						enabled = True
						name = VertexHeightNoise
					}
				}
				VertexSimplexHeightAbsolute
				{
					deformity = 250
					frequency = 10
					octaves = 6
					persistence = 0.4
					seed = 1973410634
					order = 100
					enabled = True
					name = VertexSimplexHeightAbsolute
				}
				VertexHeightNoiseRegional
				{
					multiplierMap = TheOuterWilds/KopernicusFiles/PluginData/Interloper_MultiplierMap.png
					splitChannels = False
					order = 9999
					enabled = True
					name = VHN_Regional
					Mod
					{
						deformity = 10
						frequency = 25
						octaves = 8
						persistence = 0.5
						seed = 546345
						noiseType = RiggedMultifractal
						mode = Low
						lacunarity = 0.5
						order = 9999
