@Kopernicus:FOR[TheOuterWilds]
{
	Body
	{
		name = Interloper
		Template
		{
			name = Minmus
		}
		Properties
		{
			displayName = The Interloper^N
			description = The Interloper is a large, persistent, short-period comet--a 'dirty snowball' of sorts, with a tail of ice and rubble trailing behind it. Although it is not unusual for comets to appear from deep space, come near the Sun, and shoot back off into space again, the Interloper is set apart by being much more massive, as well as occupying a retrograde orbit that regularly trespasses on the orbits of the planets. The Interloper's retrograde orbit implies it did not form alongside the other planets and planetoids, and may have originated from outside the Outer Wilds in another solar system. If it indeed arrived at its current position after migrating from interstellar space, it must have occurred relatively recently (on a cosmic scale)--It is close enough to the Sun that all the ices on its surface would have evaporated within just a couple million years.
		}
		Orbit
		{
			referenceBody = TOW/Sun
			semiMajorAxis = 149597870700
			@semiMajorAxis *= 0.25 //quarter scale
			@semiMajorAxis *= 0.97597 //timber hearth orbit in earth-au
			@semiMajorAxis *= 1.54150791 //planet orbit / timber hearth orbit
			eccentricity = 0.8225
			inclination = 187.2
			meanAnomalyAtEpochD = -11
			argumentOfPeriapsis = 180
			longitudeOfAscendingNode = 45
		}
		PQS
		{
		}
	}
}