			description = The Sun is a K3IV or "Orange Subgiant" star, so called because it is substantially larger and more luminous than most other stars of its mass, but only by a little bit. The Sun--and the Outer Wilds as a whole--is thought to be around 20 billion years old. For most of its life it was generating power by burning hydrogen fuel into helium ash in a nuclear fusion engine within its core. However, within the past few million years or so, the hydrogen in the core has run out, and hydrogen fusion now occurs in a shell surrounding the core. Eventually, the helium ashes in the core will start burning, and the Sun will get even brighter, until it sheds its outer layers away into space to form a planetary nebula.\n\n The Sun is getting larger, redder, and more luminous, and will eventually be so bright that Timber Hearth is rendered uninhabitable. The discovery that the Sun is within its last few million years of life is generally considered a "massive bummer," but there is a certain beauty in it: Millions of years ago, Timber Hearth's oceans were completely covered in ice, and all life was confined to the seas. Without the Sun nearing its end, our species would have never walked, and we would have never known about the beauty of the cosmos. (Though at least we would still have known the taste of fish.)
