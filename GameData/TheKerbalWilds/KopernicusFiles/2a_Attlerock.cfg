			description = The Attlerock, sometimes called "the moon" for obscure historical reasons that are understood by specialists, is a large, dense satellite orbiting Timber Hearth every 4.3 days. Its gravity is responsible for the tides which slosh the water in Timber Hearth's Oasis basins back and forth twice a day. It is also incredibly dense, implying a composition of mostly iron-nickel with a thin mantle or crust of rock. The Attlerock is, like Timber Hearth, covered in basins caused by giant planetoid impacts. \n\n In contrast to most of the planets in the Outer Wilds, the Attlerock has no atmosphere, so parachutes will not work there. Some aerospace researchers have suggested that pine trees be planted on the Attlerock's surface in order to provide a breathable, parachutable atmosphere. As no biologists were present for those meetings, no one bothered to tell those aerospace researchers that it wouldn't work. So we can look forward to a green Attlerock in the future!
