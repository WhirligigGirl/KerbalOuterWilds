	ASTEROIDGROUP
	{
		name = NearTH
		title = Near Hearth Ast.

		centralBody = Sun

		// With default lifetime settings, 1.1 NKOs will be around on average
		spawnRate = 0.1

		orbitSize
		{
			dist   = LogNormal
			type   = SemimajorAxis
			avg    = Resonance(Kerbin, 1:1)
			stddev = Ratio(Kerbin.sma, 0.1)
		}

		eccentricity
		{
			dist = Beta
			avg = 0.3
			stddev = 0.15
		}

		inclination
		{
			dist = Rayleigh
			avg = 3
		}

		asteroidTypes
		{
			key = 0.75 PotatoRoid
			key = 0.20 CaAsteroidCarbon
			key = 0.05 CaAsteroidMetal
		}
	}
	INTERCEPT
	{
		name = TH_Crosser
		title = Hearthian's Terror

		// One incoming rock every 25 Earth days or 100 Kerbin days
		spawnRate = 0.04

		targetBody = Kerbin

		approach
		{
			type = ImpactParameter
			dist = Uniform
			min = 0
			max = Ratio(Kerbin.soi, 1.0)
		}

		warnTime
		{
			dist = Uniform
			// 12.5-55 Earth days
			min = Ratio(Kerbin.psol,  50)
			max = Ratio(Kerbin.psol, 220)
		}

		vSoi
		{
			dist = Uniform
			min = Ratio(Kerbin.vorb, 0.01)
			max = Ratio(Kerbin.vorb, 0.05)
		}
	}
	
