	ASTEROIDGROUP
	{
		name = GD_TrojanLeading
		title = Giant's Guide Ast.

		centralBody = Sun

		// With default lifetime settings, 0.5 Trojans will be around on average
		spawnRate = 0.025

		orbitSize
		{
			dist = LogUniform
			type = SemimajorAxis
			min = Resonance(GiantsDeep, 1:1)
			max = Resonance(GiantsDeep, 1:1)
		}

		eccentricity
		{
			dist = Rayleigh
			avg = 0.07
		}

		inclination
		{
			dist = Rayleigh
			avg = 13
		}

		periapsis		// not needed in KSP, but RL requirement for resonance
		{
			type   = Longitude
			dist   = Gaussian
			avg    = Offset(GiantsDeep.lpe, 60)
			stddev = 8
		}

		orbitPhase
		{
			type   = MeanLongitude
			epoch  = GameStart
			dist   = Gaussian
			avg    = Offset(GiantsDeep.mnl0, 60)
			stddev = 8
		}

		asteroidTypes
		{
			key = 0.95 CaAsteroidCarbon
			key = 0.05 PotatoRoid
		}
	}
	
