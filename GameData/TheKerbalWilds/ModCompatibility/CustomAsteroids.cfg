	ASTEROIDGROUP
	{
		name = comet_intermediate_cold
		title = Aquaintance

		asteroidTypes
		{
			key = 1 PotatoComet
		}

		orbitType = intermediate
		useCometName = true

		centralBody = Sun

		spawnRate = 0.013

		orbitSize
		{
			type = SemimajorAxis
			dist = Uniform
			min = Ratio(Kerbin.sma, 3.38)
			max = Ratio(Kerbin.sma, 8.84)
		}

		eccentricity
		{
			dist = Uniform
			min = 0.75
			max = 0.95
		}

		inclination
		{
			dist = Rayleigh
			avg = 16.3		// 90th percentile should be 40 degrees
		}

		sizes
		{
			key = 0.3 F
			key = 0.4 G
			key = 0.3 H
		}

		orbitPhase
		{
			// Let comets be discovered only on approach, so that the player has
			// time to prepare a flyby mission
			dist = Uniform
			type  = MeanAnomaly
			epoch = Now
			min = -25.0
			max = -15.0
		}
	}

	ASTEROIDGROUP
	{
		name = comet_intermediate_hot
		title = Aquaintance

		asteroidTypes
		{
			key = 1 PotatoComet
		}

		orbitType = intermediate
		useCometName = true

		centralBody = Sun

		spawnRate = 0.003

		orbitSize
		{
			type = SemimajorAxis
			dist = Uniform
			min = Ratio(Kerbin.sma, 3.38)
			max = Ratio(Kerbin.sma, 8.84)
		}

		eccentricity
		{
			dist = Uniform
			min = 0.75
			max = 0.95
		}

		inclination
		{
			// A uniform distribution in inclination creates orbits
			// biased towards 0 and 180 in 3D space
			dist = Uniform
			min = 0
			max = 180
		}

		sizes
		{
			key = 0.3 F
			key = 0.4 G
			key = 0.3 H
		}

		orbitPhase
		{
			// Let comets be discovered only on approach, so that the player has
			// time to prepare a flyby mission
			// Aim for heliocentric radius around 1.5-2.5 AU
			dist = Uniform
			type  = MeanAnomaly
			epoch = Now
			min = -25.0
			max = -15.0
		}
	}

	ASTEROIDGROUP
	{
		name = comet_long_cold
		title = Ancient

		asteroidTypes
		{
			key = 1 PotatoComet
		}

		orbitType = long
		useCometName = true

		centralBody = Sun

		spawnRate = 0.003

		orbitSize
		{
			type = Periapsis
			dist = Uniform
			min = Ratio(Kerbin.sma, 0.52)
			max = Ratio(Kerbin.sma, 1.664)
		}

		// It's hard to represent the stock LP comets with one length and the eccentricity
		eccentricity
		{
			dist = Uniform
			min = 0.9	// Period ~ 11-62 years
			max = 0.98	// Period ~ 130-690 years
		}

		inclination
		{
			dist = Rayleigh
			avg = 16.3		// 90th percentile should be 40 degrees
		}

		sizes
		{
			key = 0.5 G
			key = 0.5 H
		}

		orbitPhase
		{
			// Let comets be discovered only on approach, so that the player has
			// time to prepare a flyby mission
			// Aim for heliocentric radius around 1.5-2.5 AU
			dist = Uniform
			type  = MeanAnomaly
			epoch = Now
			min = -12.0
			max = -7.0
		}
	}

