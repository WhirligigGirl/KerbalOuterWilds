@Kopernicus:AFTER[TheKerbalWilds]:NEEDS[!Principia]
{
	@Body[AshTwin]
	{
		@Properties
		{
			@sphereOfInfluence *= 1.5 //give a little more room to breathe.
			@rotationPeriod = -39067.65421887147
			@rotationPeriod *= 0.5 //quarter scale
			@ScienceValues
			{
				@spaceAltitudeThreshold *= 1.5
			}
		}
		@Orbit
		{
			@semiMajorAxis *= 1.5
		}
	}
	@Body[EmberTwin]
	{
		@Properties
		{
			@rotationPeriod = -39067.65421887147
			@rotationPeriod *= 0.5 //quarter scale
			@ScienceValues
			{
				@spaceAltitudeThreshold *= 1.5
			}
		}
	}
}