principia_numerics_blueprint
{
	ephemeris
	{
		fixed_step_size_integrator = QUINLAN_TREMAINE_1990_ORDER_12
		integration_step_size      = 3.5 min //3.625min unstable 3.5min stable
		fitting_tolerance = 1 mm
		geopotential_tolerance = 0x1.0p-24
		//the integrator below is useful for testing.
		// fixed_step_size_integrator = MCLACHLAN_ATELA_1992_ORDER_4_OPTIMAL
		// integration_step_size      = 5 min
		
	}
}

//ratio of hourglass twin binary period to phobos period: 0.289348896
//RSS settings:
// fixed_step_size_integrator = QUINLAN_TREMAINE_1990_ORDER_12
// integration_step_size = 10 min
// fitting_tolerance = 1 mm
// geopotential_tolerance = 0x1.0p-24
//therefore what should work is 0.28 * 10 min
@Kopernicus:NEEDS[Principia]:AFTER[TheKerbalWilds]
{
	// empirical principia twin SMA: 3644000m
	// config defined twin SMA: 3000000m

	// Period of test particle orbiting ET at 3000000m: 10632.868698191734sec
	// SMA of HT binary at 10632.868698191734sec period: 3641793.3954347624

	// period of HT as defined by config: 7949.91879974s
	// SMA of test particle orbiting ET that would have that period: 2471322.458803969
	// times 4 for rss scale: 9885289.83521588
	@Body[EmberTwin]
	{
		@Properties
		{
			@rotationPeriod = 15899.83759948
			@rotationPeriod *= 0.5
		}
	}
	@Body[AshTwin]
	{
		@Properties
		{
			@rotationPeriod = 15899.83759948
			@rotationPeriod *= 0.5
		}
		@Orbit
		{
			@semiMajorAxis = 9885289.83521588
			@semiMajorAxis *= 0.25 //quarter scale
		}
	}
}