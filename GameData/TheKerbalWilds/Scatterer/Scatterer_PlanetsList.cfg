@Scatterer_planetsList:HAS[!KerbalWildsSettings]:AFTER[TheKerbalWilds]
{
	#@KerbalWildsSettings {}
}
@Scatterer_planetsList:HAS[@KerbalWildsSettings:HAS[#SystemType[Replacer]]]:AFTER[TheKerbalWilds]
{
	@scattererCelestialBodies
	{
		!Item:HAS[#celestialBodyName[Kerbin],~name[TimberHearth]]{}
	}
}
@Scatterer_planetsList:HAS[@KerbalWildsSettings:HAS[#SystemType[Interstellar]]]:AFTER[TheKerbalWilds]
{
	@scattererCelestialBodies
	{
		@Item[TimberHearth]
		{
			@celestialBodyName = TimberHearth //TimberHearth
			@transformName = TimberHearth
		}
		@Item,*:HAS[#KerbalWilds[True]]
		{
			@mainSunCelestialBody = WildsSun
		}
	}
}