				SrfLandedSaltFlats = The surface is a bone-dry mix of silicate rock and magnesium chloride and sodium chloride salt.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				SrfLandedSaltFlats = The dust billows into the materials bay. Many of the samples begin to corrode.
				SrfLanded = You begin a careful study of the material samples' reaction to the rapid and intense thermal cycling as the Sun rises and sets.
				FlyingLow = The dust billows into the materials bay. You note how each of the materials cope with the sandblast.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				InSpace = The Ash Twin's magnetic field is a weak dipole, and the poles seem to be offset towards the Ember Twin. This actually has a few interesting implications. Ember Twin's magnetic field is not strong enough on its own to have produced this effect, which means that the magnetic field of the Ember Twin had to have been stronger in the past, so that it could magnetize the crust of the Ash Twin.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				SrfLanded = The surface is over 80 degrees centigrade on average here.
				SrfLandedSaltFlats = The surface in the flats is actually surprisingly cold! It's only around 3 degrees celsius on average. The surface isn't icy, but those crackpots who theorized the pale regions were icy don't seem to crazy anymore. The sand is so reflective that it keeps the surface cool. I think it might even be possible for there to be transient liquid water... so my question is... where IS it?
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:FOR[TheKerbalWilds]
