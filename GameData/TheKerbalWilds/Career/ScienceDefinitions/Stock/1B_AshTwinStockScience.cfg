@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				InSpaceHigh = Wait, is this really "space high above Ash Twin"!?? It feels like we're minutes away from CRASHING!
				InSpaceLow = The Ash Twin is not as spectacular as its larger, redder sibling. Even from this close, I'm still not entirely sure what the off-white material is. It could be cloud cover or an endless expanse of sand. One thing's for sure: it is NOT ice. The reflected light hitting your face through the ship's window is enough to feel slightly warm.
				SrfLandedBelt = Traveller reporting in, landed on the belt of the Ash Twin. The surface is dark gray all around, with a bit of dust blowing by.
				SrfLandedHighlands = Traveller reporting in, landed on the mountains (such as they are) of the Ash Twin. The surface is dark gray all around, and the sky looks mostly black.
				SrfLandedSaltFlats = Traveller reporting in, landed from the flats of the Ash Twin. I can confirm that the white material is solid ground, not cloud cover. But there's a ton of dust all around, it's actually kind of hard to see.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				SrfLandedSaltFlats = The dust makes it hard to see what I'm doing half the time, but from what I can tell, it's EERILY flat here. It's like someone literally sanded the Ash Twin down. Hmm... Ground Control, what do you think about this: On Timber Hearth, the sea floors are much flatter than the surrounding basin terrain. What if ocean currents wore down the Ash Twin's terrain? Crazy theory, I know, especially since we don't even know for sure if there was water here, but just throwing that out there.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				SrfLanded = The nutrient broth is exposed to the sand sample. The sensor registers a small amount of radioactive carbon gases, but then the gas stops. A new sand sample is heated to sterilize it completely, then reintroduced to the nutrients. After a few moments, there is a small amount of radioactive carbon gases. If the radioactive gases were produced by organisms metabolizing the nutrients, then they would probably have been killed by the sterilizing heater, and the heated sample would not have had the same reaction as the unheated one. Results are not conclusive, because any life on Ash Twin would have to be capable of surviving great heat, but it's not looking good for biosignatures here.
			}
		}
	}
}
