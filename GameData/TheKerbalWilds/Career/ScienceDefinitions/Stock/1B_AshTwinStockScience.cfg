@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				InSpace = Despite appearing so round, the planet is actually slightly egg shaped, with the pointy side facing towards Ember Twin. It still counts as 'rounded,' though. The surface is level almost everywhere.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = AshTwin
			Values
			{
				FlyingLow = Composition: Carbon Dioxide 90%, Oxygen 7%, Steam 2.5%, Sulphur Dioxide 0.5%. There's actually oxygen here! Oxygen should react with surface rocks over time to form metal oxides, and eventually deplete the oxygen content in the atmosphere. So where did the oxygen come from? On Timber Hearth, it's created primarily by the trees, and partly by algae in the oceans. I see two possibilities: Either the Ash Twin had a mostly water atmosphere, and the hydrogen was split off by solar radiation and then lost, or, much more excitingly, it used to have trees or algae that created the oxygen!
			}
		}
	}
}
