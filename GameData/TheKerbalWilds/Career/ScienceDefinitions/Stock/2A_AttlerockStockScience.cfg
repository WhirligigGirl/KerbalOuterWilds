@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = Attlerock
			Values
			{
				InSpaceHigh = Rough measurements of the gravity of the Attlerock seem to indicate that it is not a perfectly spherical equipotential.
				InSpaceLow = Precise measurements of the gravity of the Attlerock indicate that the Attlerock is not round! (That is to say, it is not in hydrostatic equilibrium.) There is a massive basin on the far side which is not visible from Timber Hearth, which is so deep that its missing mass upsets the gravity across the entire surface. The surface, which is mostly spherical aside from the basin, is not perfectly level. This puts to rest the question of whether or not the Attlerock counts as a planet. Planets are round, and the Attlerock, despite looking like it, is not. But it's not clear how this happened--the Attlerock should be big enough for gravity to collapse it into a sphere when it formed. Perhaps the basin was formed much later, after the Attlerock's interior had cooled down?
			}
		}
	}
}
