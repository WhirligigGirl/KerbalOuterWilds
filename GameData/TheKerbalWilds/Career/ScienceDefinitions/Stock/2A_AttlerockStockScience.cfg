@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = Attlerock
			Values
			{
				InSpaceHigh = The Attlerock now looks to the unaided eye like it does through a signalscope on Timber Hearth! And I'm talking a real nice one, like Hornfels' observatory scope! You can easily make out the craters. Golly, it's a lot more cratered than Timber Hearth!
				InSpaceLow = You scan around for a nice, flat landing spot. The whole thing is pretty seriously cratered. Perhaps the flats of the multi-ring impact basins would work?
				SrfLanded = Traveller reporting in, we have landed! On the Attlerock! Another planet! Ok yes I know it's 'not technically a planet' and 'stop saying it's a planet' and 'seriously, the hospital trip from the last argument was not fun,' but it's basically a planet.
				InSpaceLowFarsideBasin = There is a MASSIVE basin on the far side of the Attlerock. Looks almost like it's dredged all the way down to the mantle!
				InSpaceLowNearsideChaos = The terrain below appears to be particularly bumpy and chaotic.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = Attlerock
			Values
			{
				InSpaceHigh = What a magnificent sight. You can see the whole Attlerock like it's right in front of you.
				InSpaceLowFarsideBasin = There is a MASSIVE basin on the far side of the Attlerock. Looks almost like it's dredged all the way down to the mantle!
				SrfLanded = I'm seeing a very fine grain, it's almost like a powder.
				//SrfLanded = That's one small MaM, one giant L[crackle]. I repeat: That's one small MaM, one giant LaM. That's one small MaM, one giant LaM //this TMBG reference is too niche and irrelevant i should remove it.
				SrfLandedNearsideChaos = There's lots of little mountains and valleys here, but it doesn't seem to be tectonic or volcanic, at least not in the traditional sense.
			}
		}
	}
}
//It is not possible to use MysteryGoo on the Attlerock, since it lacks an atmosphere.
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = Attlerock
			Values
			{
				SrfLandedHighlands = The surface is mostly made of feldspar, if you can believe it. There's also some olivine and iron oxide impurities.
				SrfLandedCraters = The surface is mostly made of feldspar, with olivine and iron oxide impurities. There's also a fair bit of impact glass, so that confirms it: This is not a volcano!
				SrfLandedNearsideCraters = The surface is mostly made of feldspar, with olivine and iron oxide impurities. There's also a fair bit of impact glass, so that confirms it: This is not a volcano!
				SrfLandedSouthernBasin = The surface here is made of iron-rich basalt--volcanic rock! This basin might actually be a giant volcano, and not an impact crater! But then again, how did the multi-ring structure form? Perhaps there was a sufficiently large volcanic explosion that it created the same kind of shockwaves that form a multi-ring impact basin? There are also titanium impurities in the regolith.
				SrfLandedNorthwestBasin = The surface here is made of iron-rich basalt--volcanic rock! This basin might actually be a giant volcano, and not an impact crater! But then again, how did the multi-ring structure form? Perhaps lava flowed in from another location.
				SrfLandedSoutheastBasin = The surface here is made of iron-rich basalt--volcanic rock! This basin might actually be a giant volcano, and not an impact crater! But then again, how did the multi-ring structure form? Perhaps there were multiple volcanoes of different sizes that errupted at different times as the moon cooled? The surface here is more rich in magnesium than expected.
				SrfLandedFarsideBasin = The surface here is mostly olivine, but there are large chunks of an iron-nickel alloy embedded in the ground! Not iron-oxide, but metallic iron! We could be looking at the top layer of a planet's core! This is phenomenal!
				SrfLandedNearsideChaos = The surface is mostly made of feldspar, if you can believe it. There's also some olivine and iron oxide impurities.
			}
		}
	}
}
