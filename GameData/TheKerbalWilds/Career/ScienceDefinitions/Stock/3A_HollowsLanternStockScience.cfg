@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = HollowsLantern
			Values
			{
				SrfLandedSafety = The surface is a soot-covered obsidian glass, which is actually quite pretty.
				SrfLanded = The surface here is WARNING! EXTERNAL SUIT TEMPERATURE ABOVE SAFETY TOLERANCE! RETURN TO REFRIGERATED VEHICLE IMMEDIATELY! ugh. the surface here is made of WARNING! EXTERNAL SUIT TEMPERATURE ABOVE SAFETY TOLERANCE! RETURN TO REFRIGERATED VEHICLE IMMEDIATELY! the surface here is WARN--[THE SURFACE HERE IS MADE OF PARTIALLY MOLTEN LAVA!]
				SrfSplashed = As you suffer immense trauma in what may very well be your last moments, you wonder if this sample of molten lava was worth trading your life for.
				SrfSplashedHotSpots = Rest in peace, traveller.
				SrfLandedHotSpots = Rest in peace, traveller.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = HollowsLantern
			Values
			{
				SrfLanded = You expose the samples to the intense heat of Hollow's Lantern, observing which samples melt and which samples merely start to kinda bend pathetically. Despite the lack of oxygen, somehow the wood sample has caught fire? There must have been some oxygen inside the porous structure of the wood.
				SrfSplashed = You expose the samples to the intense heat of Hollow's Lantern, observing which samples melt before the structure of the material lab and which samples last a longer than the material lab.
