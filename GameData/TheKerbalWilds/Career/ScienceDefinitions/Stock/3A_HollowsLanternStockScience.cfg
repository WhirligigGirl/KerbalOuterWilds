@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = HollowsLantern
			Values
			{
				InSpaceHigh = Hollow's Lantern glows an intense red-orange beneath you. You feel some trepedation about the prospect of getting any closer.
				InSpaceLow = The spacecraft's thermal alert is going off. Should I be worried about this? We haven't even, like, got to the surface yet.
				FlyingHigh = Really, the atmosphere is THIS high? I mean I guess it makes sense, it's a small body so the gravity doesn't squish the atmosphere much, and it's so hot that the gas particles have a lot of oomph to 'em so they fly around real high.
				FlyingLow = Are we uh. Are we gonna address the thermal alarms? No? Ok, if you say so.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = HollowsLantern
			Values
			{
				InSpaceLow = The radiated heat from Hollow's Lantern even at this height is enough to run your suit's coolers at maximum.
				Flying = I would really like to get back inside now thanks.
				SrfLandedSafety = My space suit's thermal alert is going off. Safety my a--oh right, gotta keep it safe for the hatchlings.
				SrfLandedMeltingGround = WARNING! EXTERNAL SUIT TEMPERATURE ABOVE SAFETY TOLERANCE! RETURN TO REFRIGERATED VEHICLE IMMEDIATELY! WARN--oh will you cut that damn thing off? The heat is miserable enough without that warning blaring in my ears.
				SrfLandedMoltenLava = OH GOD IT BURNS! IT BURNS! THIS WAS A TERRIBLE IDEA!
				SrfSplashedMoltenLava = OH GOD IT BURNS! IT BURNS! THIS WAS A TERRIBLE IDEA!
				SrfSplashedHotSpots = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA [Comm signal lost]
				SrfLandedHotSpots = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA [Comm signal lost]
			}
		}
	}
}
