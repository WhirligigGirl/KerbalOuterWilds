	{
		Body
		{
			name = HollowsLantern
			Values
			{
				InSpace = Hollow's Lantern's temperature ranges from around 400 degrees centigrade in the cooler regions to nearly 2,700 degrees in the hotspots.
				Flying = The temperature gradually increases with proximity to the surface.
				SrfLandedSafety = The instrument registers high temperatures in excess of 400 degrees.
				SrfLandedMeltingGround = The surface temperature here is around 700-900 degrees.
				SrfLandedMoltenLava = The surface temperature here is around 1,000 degrees.
				SrfSplashedMoltenLava = The surface temperature here is in excess of 1,500 degrees.
				SrfSplashedHotSpots = The surface temperature here is in excess of 2,500 degrees.
			}
		}
	}
}
