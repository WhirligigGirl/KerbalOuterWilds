@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = HollowsLantern
			Values
			{
				SrfLanded = Surface gravity is low, around 0.12 gees.
				SrfSplashed = Surface gravity is low, at 0.122447 gees.
				InSpace = The tidal forces from Brittle Hollow are not actually sufficient to explain the heat flux experienced by Hollow's Lantern. But it's known that Hollow's Lantern is variable, and goes through long dormant periods between eruptions. In fact, just a few years ago Hollow's Lantern was in a nearly century-long dormant period. Accounting for historical trends and the average luminosity of the moon, the energy delivered by tidal friction ends up being much closer to the average energy emitted by Hollow's Lantern.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = HollowsLantern
			Values
			{
				FlyingHigh = The atmosphere is comprised of Carbon Dioxide, Sulfur Dioxide, Nitrogen, Hydrogen Sulfide, and Argon.
				FlyingLow = Composition: Carbon Dioxide 30%, Sulfur Dioxide 28%, Nitrogen 18%, Hydrogen Sulfide 11%, Argon 10%, Neon 2.6%, Carbon Monoxide 0.3%, Hydrogen 0.1%. All of these gases are too lightweight to remain on Hollow's Lantern, they should have escaped by now. Of course that assumes there isn't a continuous stream of gas being emitted by something. Gee, I wonder.
				FlyingLowHotspots = In addition to the gases found in the rest of the atmosphere, the hotspots seem to have a small amount of rock vapor.
			}
		}
	}
}
