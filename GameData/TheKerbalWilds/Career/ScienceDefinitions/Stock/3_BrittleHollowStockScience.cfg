@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				InSpaceHigh = I can see Brittle Hollow out the window. Its Lantern is... intense.
				InSpaceLow = Brittle Hollow's terrain almost seems fractal. No matter how close we get, it just keeps getting more and more fractured and cracked looking.
				FlyingLow = Brittle Hollow's fractal terrain doesn't continue to resolve forever, it does bottom out with cell sizes of a few dozen or hundred meters or so, but wow those are some steep terraces. A horizontal landing or rover mission here might be a little difficult.
				SrfLanded = Traveller reporting in from Brittle Hollow's surface! It's really eerie here, all cool tones.
				FlyingLowSplitCrater = The crater seems to have been formed before whatever event fractured the terrain here. Half of the crater has been translated sideways. It is difficult to imagine what process could have resulted in this.
				FlyingLowCraters = The craters here are small and somewhat eroded.
				FlyingLowKnowledgeBasin = It was long thought that Brittle Hollow's Knowledge Basin was similar to the Village Basin--essentially a massive impact crater. The fractured morphology here casts some doubt on that hypothesis.
				FlyingLowCraterChain = The craters here are all in a chain. Unless these are actually a volcanic feature, this may imply an impactor which broke up before hitting the planet.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				InSpace = Brittle Hollow's terrain almost seems fractal. No matter how close we get, it just keeps getting more and more fractured and cracked looking.
				FlyingHigh = Ok yes I can confirm there's an atmosphere, can I go back inside now?
				SrfLanded = The surface morphology is like nothing I've ever seen. The planet is covered in these cellular plates with sharp falloffs at the edges. There's almost no slopes on the planet, but the ground as not remotely flat.
				SrfLandedSouthernIceCap = The surface here is a lot less cellular than other parts of the planet, and a lot smoother. I think it's all ice.
				SrfLandedNorthernGlacier = The surface here is a lot less cellular than other parts of the planet, and a lot smoother. I think it's all ice.
				SrfLandedCrystals = The morphology of the surface is the same here as it is everywhere else, but the altitude is a lot lower. The surface is made of a mix of crystals of reddish and orangish colors.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				SrfLanded = A sample of the surface is exposed to the nutrient broth. No radioactive carbon gas is detected, indicating no chemical reactions, let alone biology.
				Flying = The atmosphere is exposed to the nutrient broth. No radioactive carbon gas is detected, indicating no chemical reactions, let alone biology.
				SrfLandedNorthernGlacier = The ice sample is exposed to the nutrient broth. Remarkably, a small trickle of radioactive carbon gas is detected by the sensor. A second sample is prepared, and it's sterilized this time. When exposed to the nutrients, the sensor does not detect any gas! This is a positive result! There may very well be microorganisms living in the ice!
				
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				SrfLanded = The surface is comprised of columnar-jointed basalt with inclusions of some blue crystals I haven't yet identified. My working theory is that Brittle Hollow's surface cooled unevenly as it formed, and then it cracked from the tension, sorta like mudcracks on Timber Hearth during the dry season.
				SrfLandedSouthernIceCap = The surface here is made of packed carbon dioxide ice with a layer of fresh CO2 snow atop it. The snow must have blown in from a blizzard at some point.
				SrfLandedNorthernGlacier = The surface here is made of packed carbon dioxide ice with a layer of fresh water-ice snow atop it. The snow must have blown in from a blizzard at some point.
				SrfLandedCraters = The surface is mostly basalt, but there is some impact glass as well.
				SrfLandedCraterChain = The surface is mostly basalt, but there is some impact glass as well.
				SrfLandedSplitCrater = The surface is mostly basalt, but there is some impact glass as well.
				SrfLandedKnowledgeBasin = The surface is mostly basalt, but there is some impact glass as well. Despite the weird morphology, this likely IS an impact basin like the Village Basin after all.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				InSpaceHigh = You record the behavior of the materials throughout the interplanetary transfer to Brittle Hollow.
				InSpaceLow = You expose the samples to space around Brittle Hollow. They seem to react more or less the same way that they react around Timber Hearth.
				FlyingHigh = You expose several metals, ceramics, and wood samples to the shock plasma of Brittle Hollow's atmosphere, in order to determine what materials are best suited for atmospheric entry here.
				FlyingLow = The atmosphere is not especially reactive. Most of the materials are unaffected.
				SrfLanded = You expose the materials bay to the surface conditions of Brittle Hollow, to note how they cope with the bitterly cold winds.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				InSpaceHigh = From this altitude it is difficult to detect much of a difference between the interplanetary magnetic field and the magnetic field of Brittle Hollow.
				InSpaceLow = Brittle Hollow's largest scale plates each seem to have very weak magnetic fields pointing in different directions, with a complex twisted field at the boundaries of magnetic domains which is slightly stronger than the center of the plates.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				InSpaceHigh = The IR sensor's readings are mostly dominated by Hollow's Lantern, it's hard to get a reading of Brittle Hollow itself from here.
				InSpaceLow = Brittle Hollow's surface appears to be around negative 10 to 30 degrees centigrade or so.
				SrfLanded = The surface is quite cold here, averaging just under negative 20 degrees centigrade.
				SrfLandedNorthernGlacier = The surface here is incredibly frigid.
				SrfLandedSouthernIceCap = The surface here is incredibly frigid.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				InSpace = The exosphere is too thin to be detected from this altitude.
				SrfLanded = Atmospheric pressure is around 60% of Timber Hearth sea level--it's actually a habitable pressure, though that's assuming you have oxygen.
				FlyingLow = The pressure is around 20% of Timber Hearth's sea level.
				FlyingHigh = The pressure at these altitudes is substantially less than that of Timber Hearth's surface.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = BrittleHollow
			Values
			{
				SrfLanded = The planet seems to have a fairly consistent rate of seismic activity, but there isn't much going on in this area in particular, so the data is fairly noisy.
				SrfLandedSouthernRift = The seismic activity is quite high here! You are able to run a survey to determine the interior structure of the planet. The results suggest that Brittle Hollow is, in fact not actually hollow. So there's one mystery solved. In fact the planet seems to be all rock, with very little internal differentiation. If there is a core, it's far too small to detect, at least with this equipment at this location.
				SrfLandedCrystals = The seismic activity is quite high here! You are able to run a survey to determine the interior structure of the planet. The results suggest that Brittle Hollow is, in fact not actually hollow. Further analysis shows an anomaly in the data. There appears to be an incredibly sharp increase in the density and temperature of the planet within 10 kilometers of the center.
			}
		}
	}
}
