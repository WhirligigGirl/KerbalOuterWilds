@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/SunKerbalWilds/Sun
			Values
			{
				InSpaceHigh = As you drift between the planets, you reflect on the plight of your species. For a moment, a certain sense of hopelessness and pointlessness washes over you, but you shake it off. Let's explore while we can!
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/Sun
			Values
			{
				InSpaceHigh = A feeling of profound loneliness and melancholy washes over you. You are utterly alone here. You face away from the Sun. The night sky in all its brilliance stretches out in front of you. You can even spot some deep sky objects with the unaided eye. You look for the point-like dots of the planets, trying to figure out which one is Timber Hearth.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/Sun
			Values
			{
				Flying = The instrument fails to detect any life because it fails to exist.
			}
		}
	}
}
//It is not possible to take a surface sample from the Sun.
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/Sun
			Values
			{
				InSpaceHigh = You expose the materials to the interplanetary environment, probing how the samples react long term to the solar wind and constant heating from the Sun. Some of the samples are glowing! How pretty...
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/Sun
			Values
			{
				InSpaceLow = Precise measurements of the Sun's magnetic field reveal a twisted, tangled mess that wraps around the equator of the Sun. 
				InSpaceHigh = The interplanetary magnetic field is dominated by the solar wind plasma, a stream of positively charged radiation billowing out from the Sun.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/Sun
			Values
			{
				InSpaceHigh = Thermal infrared measurements of the Sun help refine the Sun's temperature estimate. It appears to be 4959 Kelvins.
				InSpaceLow = The sensor is heating up. External temperature is approaching 4959 Kelvins, and internal temperature is steadily rising.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/Sun
			Values
			{
				Flying = The barometer registers a signal, but unfortunately the signal is "missing barometer."
			}
		}
	}
}
//It is not possible to take a seismic accelerometer to the Sun.
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/Sun
			Values
			{
				InSpaceLow = Precise measurements of the Sun's gravitational field suggest that it is very nearly perfectly round.
				InSpaceHigh = Micrometrically precise measurements of the spacecraft's trajectory provides mass estimates for each of the planets, including the ones we didn't have good data for previously: Giant's Deep is about 8 M_th, with a surface gravity of around 2g and a density of 5.9 g/cm^3, and Dark Bramble is... drumroll please... thank you Chert. 0.74 M_th! That implies a surface gravity of 0.6g and a density of 3.1 g/cm^3, which is even lower than Brittle Hollow's! The Hourglass Twins: 0.76 M_th. Timber Hearth & Attlerock: 1.03 M_th. Brittle Hollow & Lantern: 1.2 M_th.
			}
		}
	}
}
