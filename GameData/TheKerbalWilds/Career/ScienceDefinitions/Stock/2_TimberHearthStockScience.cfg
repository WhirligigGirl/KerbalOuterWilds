@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				SrfLandedVillageBasin = The atmospheric pressure is near 1 atmosphere.
				SrfSplashed = Atmospheric pressure reads exactly 1 atmosphere.
				SrfLandedHighDesert = The atmosphere is thin here, around 1/3rd of sea level. You wouldn't be able to breathe here!
				SrfLandedGreatGeyser = The atmosphere towards the peak is almost negligible. You wonder if you'd be able to complete an orbit around the planet and just barely graze the geyser.
				SrfLandedSmallGeysers = The atmosphere is thin here, around 1/3rd of sea level. You wouldn't be able to breathe here!
				SrfLandedGeyserMountains = The atmosphere is thin here, around 4% of sea level. Forget about breathing here!
				FlyingLow = The atmosphere decreases in pressure with altitude.
				FlyingHigh = The atmosphere pressure is less than 3% of sea level pressure!
				InSpace = Just to double check that you are indeed in space, you activate the barometer. It reads 0 kpa. Yep! You're in space!
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				SrfSplashed = You can't get any seismic information from the sea, but at least you can get some good wave data!
				SrfLanded = You take seismic readings. From the echoes of geyser eruptions bouncing around you can get a pretty good idea of the internal structure of the planet: A solid iron core surrounded by a semi-molten rock mantle, with a solid rocky crust. There are several dips in the crust--these have long been suspected to be other multi-ring impact basins than just the Village Basin. Crazy hypothesis, am I right? ::P
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				SrfLanded = Surface gravity reads approximately one gee.
				InSpaceLow = You map out the gravitational field of Timber Hearth. The basins appear to be regions of anomalously high gravity (beyond the obvious fact that they are closer to the center.)
				InSpaceHigh = Precise measurements of the spacecraft's trajectory over time could be used to make slightly better estimates of Giant's Deep and Dark Bramble's mass, but you know, we have a space program, we could just go and check. Besides, it'd be easier to do that kind of study from solar orbit, where it's easier to control for Timber Hearth and the Attlerock.
			}
		}
	}
}
