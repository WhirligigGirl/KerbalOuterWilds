// # Timber Hearth
// * Used to be covered in polar glaciers, with all of the basin water hidden under ice. Hearthian life did not even see the Sun until a few million years ago.
// * Impact basins much younger than highland terrain (by billions of years), evidence of a late period of giant impacts on Timber Hearth.
// * High desert is uninhabitable to Hearthians without PPE. Air too thin, too dry. Hearthians are aware of the 
// * Each basin has been niche partitioned for literally billions of years. Most basins do not share common tree of life.
//Biomes:
//Waters
//HighDesert
//VillageBasin
//Canyons
//Craters
//YoungbarkBasin
//PoetsGrove
//AncientGlade
//NomaiBasin
//GreatGeyser
//GeyserMountains
//SmallGeysers
//FrigidWastes

@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				InSpaceHigh = From this altitude I can see the entirety of Timber Hearth. Woah. It's crazy how small and fragile it looks. It's hard to believe almost the whole known world is just confined to one of those crater basins.
				InSpaceLow = Traveller reporting in from space. The view here is really spectacular. You know, you don't really think of the world as being this endless desert, but that's what it looks like from up here. Really makes you appreciate the Village Basin a lot more.
				FlyingLowCraters = These craters are simple in shape, not multi-ringed. I don't think these count as basins.
				FlyingLowVillageBasin = Hey ground control, I think I can see my house from here!
				FlyingLowHighDesert = The endless flat expanse of the desert stretches out below you. You half wonder if you will ever find another basin.
				FlyingLowWaters = The sea 
				SrfSplashedWaters = You know how Fossil et al published a paper that said we evolved from fish? Yeah right. I feel sick. I managed to get to space and back but I can barely keep my lunch down here. Oh am I glad I didn't join The Ocean Water Ventures instead. Besides, they took our name! Sure it took us longer to get up and running than they did, but we had the name first! Now people can't tell us apart except by the fact that we do totally different things.
				FlyingLowYoungbarkBasin = The basin beneath you appears to be covered in ice and snow, due to its high latitude.
				FlyingLowPoetsGrove = You can see snow-capped trees below. Perhaps all Timber Hearth life has a common ancestor?
				FlyingLowAncientGlade = You can see snow-capped trees below. Perhaps all Timber Hearth life has a common ancestor?
				FlyingLowNomaiBasin = You can see trees below. Perhaps all Timber Hearth life has a common ancestor?
				FlyingLowGreatGeyser = The geyser stretches across the horizon. What forces could possibly have caused a volcano to become so large?
				FlyingLowGeyserMountains = Multiple enormous geysers are visible from here, far, far larger than any in the Village Basin. Aw heck, each one might even be larger than the Southern Sea.
				FlyingLowSmallGeysers = These geysers look similar to the ones in the Village Basin!
				FlyingLowFrigidWastes = It's endless snowfall here. Really hope the oxygen content down there is good enough for campfires.
				FlyingHigh = The sky is starting to vanish out from overhead. I think I can see a few stars!
				SrfLanded = Well... Huh. I didn't think this through very well. Ship recovery is going to be something of an issue.
				SrfLandedVillageBasin = Traveller reporting in from the ground. We landed in one piece... I think.
				SrfLandedKSC =  Traveller reporting in from the ground. We landed in one piece... I think.
				SrfLandedRunway = Traveller reporting in, awaiting launch codes.
				SrfLandedLaunchpad = Traveller reporting in, awaiting launch codes.
				FlyingLowCanyons = The morphology of the canyons indicates glacially carved features.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				InSpaceLow = I'm leaving the ship now. Whooo... this is fun! Hey y'all fixed the retrothrusters on the jetpack right?
				InSpaceHigh = It's really special, getting to do this, and getting to be up here. I mean, you might think it gets lonely and isolated in the protected parks, or the High Desert, but that's just peanuts to the Outer Wilds. And just think! We have so much further to go, and so much more to see!
				FlyingLow = This is a rather precarious situation. You remembered to pack a parachute, right?
				FlyingHigh = You wonder if you could roast a marshmallow on reentry shock plasma.
				SrfLanded = Well... Huh. I didn't think this through very well. Crew recovery is going to be something of an issue.
				SrfLandedKSC = You know, I'm kinda glad we didn't go with the whole 'wooden barn' concept for the VAB, you know? Like, it kinda seems like it woulda been flammable. Still though, it's not really rustic enough for my tastes, maybe we could decorate it with some kind of space-grade plastic that just LOOKS like it's made of wood?
				SrfLandedLaunchpad = Do you think we could slightly decrease the launch delta-v requirements if we launched from a tree-top?
				SrfLandedVillageBasin = It's gonna be a long hike back home, but how bad can it be?
				SrfLandedYoungbarkBasin = It's pretty cold here! I'm gonna go gather some wood for a campfire, maybe roast some s'mores.
				SrfLandedPoetsGrove = It's pretty cold here! I'm gonna go gather some wood for a campfire, maybe roast some s'mores.
				SrfLandedAncientGlade = It's pretty cold here! I'm gonna go gather some wood for a campfire, maybe roast some s'mores.
				SrfLandedNomaiBasin = This place is so beautiful and pristine, we oughtta make it a protected park.
				SrfLandedCanyons = This place is so beautiful and pristine, we oughtta make it a protected park.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				SrfLandedKSC = You calibrate the SABINAITE experiment under known conditions. A steady stream of radioactive gas is detected by the equipment, indicating that the Mystery Goo™ is being consumed by hearthian microorganisms.
				SrfLandedLaunchpad = You calibrate the SABINAITE experiment under known conditions. After a while, a sparse stream of radioactive gas is detected by the equipment, indicating that the Mystery Goo™ is being consumed by airborn hearthian microorganisms.
				SrfLandedVillageBasin = You calibrate the SABINAITE experiment under known conditions. A steady stream of radioactive gas is detected by the equipment, indicating that the Mystery Goo™ is being consumed by hearthian microorganisms.
				SrfSplashed = The water, being far from sterile, readily consumes the Mystery Goo™ nutrients. A steady stream of radioactive gas is detected in the water sample from aquatic microorganisms metabolizing the radioactively labelled nutrient samples.
				SrfLandedYoungbarkBasin = The soil sample is exposed to the nutrient sample. Within moments a steady stream of radioactive gas is detected by the equipment. What's peculiar, though, is that the ratio of gases are completely different than what is seen in the Village Basin--Microorganisms native to this basin seem to be producing some chlorine gas.
				SrfLandedPoetsGrove = The soil sample is exposed to the nutrient sample. Within moments a steady stream of radioactive gas is detected by the equipment. There's not just macroscopic life here, but microscopic too!
				SrfLandedAncientGlade = The soil sample is exposed to the nutrient sample. Within moments a steady stream of radioactive gas is detected by the equipment. There's not just macroscopic life here, but microscopic too!
				SrfLandedCanyons = The soil sample is exposed to the nutrient sample. Within moments a steady stream of radioactive gas is detected by the equipment. There's not just macroscopic life here, but microscopic too!
				SrfLandedNomaiBasin = The soil sample is exposed to the nutrient sample. Within moments a steady stream of radioactive gas is detected by the equipment. There's not just macroscopic life here, but microscopic too!
				SrfLandedHighDesert = The soil sample is exposed to the nutrient broth. There is a short pause, but eventually radioactive gas is detected. You decide to double check the results, with a new soil sample. This time, the sample is heated to sterilize it, just to make sure that the reaction is not abiotic. After sterilizing the sample, No Carbon-14 is detected. Despite the lack of water, there IS microscopic life in the High Desert. 
				SrfLandedFrigidWastes = The ice sample is exposed to the nutrient broth. After a short pause, radioactive gas is detected by the instrument, indicating the presence of microorganisms living within the ice!
				SrfLandedGreatGeyser = The sample is exposed to the nutrient broth. After a short pause, radioactive gas is detected by the instrument, indicating the presence of microorganisms living on the surface!
				SrfLandedGeyserMountains = The sample is exposed to the nutrient broth. After a short pause, radioactive gas is detected by the instrument, indicating the presence of microorganisms living on the surface!
				SrfLandedSmallGeysers = The sample is exposed to the nutrient broth. After a short pause, radioactive gas is detected by the instrument, indicating the presence of microorganisms living on the surface!
				FlyingLowHighDesert = The nutrient sample is exposed to the atmosphere. The gas sample is then analyzed for radioactive gas that would indicate the nutrients are being metabolized, but there is no evidence of activity.
				FlyingLow = The MysteryGoo™ nutrient sample is exposed to the atmosphere. After a while, a sparse stream of radioactive gas is detected by the equipment, indicating that the Mystery Goo™ is being consumed by airborn hearthian microorganisms.
				FlyingHigh = The nutrient sample is exposed to the atmosphere. The gas sample is then analyzed for radioactive gas that would indicate the nutrients are being metabolized, but there is no evidence of activity.
				FlyingHighGeyserMountains = The MysteryGoo™ nutrient sample is exposed to the atmosphere. After a while, a sparse stream of radioactive gas is detected by the equipment, indicating that the Mystery Goo™ is being consumed by airborn hearthian microorganisms. In order to reach this high, the organisms must have come from the plumes of the geysers.
				FlyingHighGreatGeyser = The MysteryGoo™ nutrient sample is exposed to the atmosphere. After a while, a sparse stream of radioactive gas is detected by the equipment, indicating that the Mystery Goo™ is being consumed by airborn hearthian microorganisms. In order to reach this high, the organisms must have come from the plume of the geyser.
				FlyingHighSmallGeysers = The MysteryGoo™ nutrient sample is exposed to the atmosphere. After a while, a sparse stream of radioactive gas is detected by the equipment, indicating that the Mystery Goo™ is being consumed by airborn hearthian microorganisms. In order to reach this high, the organisms must have come from the plume from the geyser.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				SrfSplashedWaters = The sample is freshwater. Probably. Obviously if it's in one of the main basin seas it's saltwater. Where did you land again? What are you doing here? What is anyone doing here!? Who knew joining the Outer Wilds Ventures would have you considering so many thought provoking existential questions!
				SrfLanded = You take a soil sample. It is remarkably like the soil in the Village Basin.
				SrfLandedLaunchpad = You hope no one will miss this one particular chunk of concrete.
				SrfLandedRunway = You hope no one will miss this one particular chunk of asphalt.
				SrfLandedVillageBasin = You see a cool looking rock on the ground. Looks like a shard of volcanic glass, or maybe a broken sap wine bottle? Either way, it'll make a great addition to your rock collection!
				SrfLandedHighDesert = You take a sample of the sand. It is a fine grain, and flows readily, not sticky at all like beach sand is. On the beach, a large fraction of sand is made of the shells of aquatic animals. Here, there's no evidence of broken shells. The sand is just silicate rock dust. There are oxides in the sand that don't seem to be readily explained by the oxygen content at these altitudes. Was Timber Hearth's atmosphere thicker in the past?
				SrfLandedGeyserMountains = The sample is made of basalt, with a layer of ice.
				SrfLandedGreatGeyser = The sample is made of basalt, with a layer of ice.
				SrfLandedSmallGeysers = The sample is made of basalt, with a layer of ice.
				SrfLandedAncientGlade = The soil sample is tough to dig out, frozen in ice.
				SrfLandedPoetsGrove = The soil sample is tough to dig out, frozen in ice.
				SrfLandedYoungbarkBasin = The soil sample is tough to dig out, frozen in ice.
				SrfLandedCraters = You take a sample of the surface, and find little pieces of impact glass, like we see in the small craters in the Village Basin. This is indeed an impact feature, not a volcanic one!
				SrfLandedFrigidWastes = The ice sample is tough. That's a shame, you would have much preferred snowfall.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				SrfLanded = A thin layer of oxide film immediately appears on the metals.
				SrfSplashed = Some of the metal samples violently explode! Luckily they're not very big, so they only ruined the rest of the materials bay.
				SrfLandedYoungbarkBasin = A test strip designed to probe the atmospheres of *other* planets has, bizarrely, registered a small chlorine reaction.
				FlyingLow = The samples are rattled and shaken by the wind, and it's hard to get a good read on what's happening. Maybe they should have secured the samples better?
				FlyingHigh = You take careful note of how each material reacts to the shock plasma. This will have important implications for the development of better reentry-capable alloys and coatings. The wood, uh, melted? You didn't even know wood COULD melt.
				InSpaceLow = You run a comparative study on various different spacecraft hull alloys. Unfortunately, the wood samples are too porous to work as a pressure vessel, although once outgassed they could work as thermal insulation.
				InSpaceHigh = Some of the samples are glowing. A few samples slowly begin to turn yellow over time.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = KerbalWilds/TimberHearth
			Values
			{
				SrfLanded = Local fluctuations in the magnetic field are recorded for geophysical analysis.
				InSpaceLowHighDesert = There is strong evidence of east-west stripes of crustal magnetization in the highlands which is not found in other regions of the planet.
				InSpaceLow = The magnetic fields are relatively weak here.
				InSpace = You map out the complex interaction between the solar wind plasma and the weak induced magnetic field of Timber Hearth.
			}
		}
	}
}
