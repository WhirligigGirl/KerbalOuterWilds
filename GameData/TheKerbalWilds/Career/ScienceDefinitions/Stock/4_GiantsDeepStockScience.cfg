@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				InSpaceHigh = Giant's Deep doesn't seem to be revealing any more detail from this distance than it does through Hornfels' signalscope at the Observatory on Timber Hearth. But wow is it pretty or what?
				InSpaceLow = From this distance, Giant's Deep resolves into a mass of swirling cloud patterns, mostly banded. In the north equatorial area, the clouds take a festooned appearance, while the south equatorial region is a chaos of mixing swirling storms.
				FlyingHigh = From this altitude there is still nothing but clouds.
				FlyingLow = Finally the clouds have thinned! It's difficult to make out clearly, it's so dim down here, but I think the surface is an ocean. What I'm seeing is a remarkable cloudscape, with frankly horrifying twisters connecting the surface to the top of the clouds.
				FlyingLowShipyardIsland = Finally the clouds have thinned! It's difficult to make out clearly, it's so dim down here, but I think I see a landmass! What I'm seeing is a remarkable cloudscape, with frankly horrifying twisters connecting the surface to the top of the clouds.
				FlyingLowGabbrosIsland = Finally the clouds have thinned! It's difficult to make out clearly, it's so dim down here, but I think I see a landmass! What I'm seeing is a remarkable cloudscape, with frankly horrifying twisters connecting the surface to the top of the clouds.
				FlyingLowStatueIsland = Finally the clouds have thinned! It's difficult to make out clearly, it's so dim down here, but I think I see a landmass! What I'm seeing is a remarkable cloudscape, with frankly horrifying twisters connecting the surface to the top of the clouds.
				FlyingLowTrialIsland = Finally the clouds have thinned! It's difficult to make out clearly, it's so dim down here, but I think I see an icy surface! What I'm seeing is a remarkable cloudscape, with frankly horrifying twisters connecting the surface to the top of the clouds.
				FlyingLowBrambleIsland = Finally the clouds have thinned! It's difficult to make out clearly, it's so dim down here, but I think I see... well I'm not entirely sure what I'm looking at to be honest. Might be a landmass, or an iceberg. What I'm seeing is a remarkable cloudscape, with frankly horrifying twisters connecting the surface to the top of the clouds.
				SrfLanded = Believe it or not, Giant's Deep actually DOES have landmasses!
				SrfLandedBrambleIsland = Believe it or not, Giant's Deep actually DOES have landmasses! At least... kinda.
				SrfSplashed = Giant's Deep definitely has an ocean! The waves are tossing the ship all around this way and that and I'm worried it's not going to stay upright for long. And that's WITHOUT those cyclones approaching!
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				FlyingLow = Being unprotected outside of the ship around all these cyclones is not where I want to be!
				SrfLanded = There is near constant rainfall. With such a thick atmosphere, the wind is buffetting me and trying to knock me over. The cyclones are moving shockingly fast. I do not want to get hit by one of them. Hard to get a good feel for the gravity with all the wind blowing, but it seems like about three times Timber Hearth? Or is that just the weight of the space suit? I'm not sure.
				SrfSplashed = The water is so cold that the space suit's heater is struggling to keep up. It doesn't seem possible for it to be this cold. The wind is pushing the waves around dramatically, and with such a thick atmosphere, the wind is buffetting me and trying to knock me over. The cyclones are moving shockingly fast. I do not want to get hit by one of them.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				FlyingHigh = The nutrients are exposed to the clouds of Giant's Deep. The nutrients readily react with whatever is in the clouds! As a followup, a second aerosol sample is heated up and then exposed to the nutrients. There are now almost no reactions happening, implying the first reactions were biological!
				FlyingLow = The nutrients are exposed to the atmosphere of Giant's Deep. The nutrients readily react with whatever is in the atmosphere! As a followup, a second aerosol sample is heated up and then exposed to the nutrients. There are now almost no reactions happening, implying the first reactions were biological! A followup study reveals that the reaction products were mostly methane gas, implying an organism capable of hydrogen breathing methanogenic respiration.
				SrfSplashedShallowWaters = The nutrients are exposed to the ocean of Giant's Deep. A small orange object enters the sample and begins feeding on the sample! This is not a drill! Animal life has been directly detected on Giant's Deep!
				SrfSplashedDeepOcean = The nutrients are exposed to the atmosphere of Giant's Deep. The nutrients readily react with the water sample. As a followup, a second water sample is brought to the boiling point (which is actually shockingly low) and then exposed to the nutrients. There are now almost no reactions happening, implying the first reactions were biological! A followup study reveals that the reaction products were mostly methane gas, implying an organism capable of hydrogen breathing methanogenic respiration.
				SrfLanded = A surface sample is exposed to the nutrient broth. The radioactive nutrients are readily consumed and a whole lot of radioactive methane is detected! A followup test sterilizes the surface sample before the nutrients are reintroduced. This time, there is virtually no radioactive carbon gases detected, which implies the reactions in the first sample were biological!
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				SrfLanded = The sample is mostly silicon dioxide sand, drenched in a water-ammonia mix.
				SrfLandedStatueIsland = The surface is mostly wet sand, but as you dig around, you find something that almost looks like a twig! When you pick it up, it bends like plastic. You're pretty sure it's not a part of your spacecraft, and it doesn't look manufactured, it almost looks... biological?
				SrfLandedBrambleIsland = The sample is almost entirely water ice, with some peculiar organic compounds in the mix. As you dig around some more, you find some solid chunks of glossy, thorny material which seem to bend like plastic. You're pretty sure it's not a part of your spacecraft, and it doesn't look manufactured, it almost looks... biological?
				SrfLandedTrialIsland = The sample is mostly a water and ammonia ice snow. Digging a little deeper, you reach a solid rocky surface made of igneous rocks.
				SrfSplashed = The sample is an absolutely frigid mix of Ammonia and Water, much colder than the freezing point of either ammonia or water alone. The Ammonium Hydroxide has a density of 0.91 grams per cubic centimeter and you DO NOT want to get any of it on you. Chemical burns and frostbite together don't seem like a fun combination. As if the ammonia wasn't bad enough, there's also a ton of perchlorates and formaldehyde in the sample, which are both highly toxic, and traces of hydrogen chloride. The formaldehyde is actually somewhat mysterious, there's no planetological reason it should be here.
				SrfSplashedShallowWaters = The sample is an absolutely frigid mix of Ammonia and Water, with a substantial fraction of formaldehyde and dissolved perchlorates. Much more importantly, there are small glowing orange motes floating around in the water. This could very well be a macroscopic life form!
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				InSpace = You expose the materials to the thermal environment of Giant's Deep orbit.
				FlyingHigh = You expose the materials to the shock plasma, noting which alloys cope best with the heating.
				FlyingLow = You expose the materials to the atmosphere of Giant's Deep. The chemical reactions in the test strips imply a strongly reducing atmosphere, rather than oxidizing.
				SrfSplashed = You expose the materials to the frigid ocean on Giant's Deep, examining which alloys cope well and which alloys become brittle. At least one of the samples pops and crackles.
				SrfLanded = You expose the materials to the surface conditions on Giant's Deep, examining the effect of the brutal wind and rain.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				InSpaceHigh = Giant's Deep's magnetic field is clearly the most powerful in the solar system outside of the Sun's. It is readily detected even from this distance, and seems to be shielding the planet from the solar wind.
				InSpaceLow = Giant's Deep's magnetic field is bipolar, but shockingly, the magnetic field is extremely tilted relative to the poles of rotation.
			}
		}
	}
}
