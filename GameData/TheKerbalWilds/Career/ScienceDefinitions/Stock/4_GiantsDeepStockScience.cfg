@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				SrfLanded = The planet appears to be seismically active, though it's not clear if it is through tectonic activity or volcanism. A study of the data suggests Giant's Deep has a rocky composition that gets steadily heavier and heavier as it approaches the center, but without an actual core boundary. The surface gravity is approximately 2.017g, yielding a density of 5.9 grams per cubic centimeter and a mass of exactly 8.06800116 Timber Hearth masses.
				SrfSplashed = You can't really get any measurements, splashing about as you are.
			}
		}
	}
}
