@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = GiantsDeep
			Values
			{
				FlyingHigh = The atmosphere is composed of roughly half hydrogen, 1/5th helium, 1/5th methane, and some other traces. There is much more methane than expected.
				FlyingLow = Composition: Hydrogen 55%, Helium 20%, Methane 20.6%, Ammonia 4%, Water 0.3%, Chlorine 0.06%, Hydrogen Chloride 0.04%. The methane and chlorine are both vastly more abundant than models suggest they should be. The clouds are made of water-ammonia droplets with a substantial fraction of formaldehyde, which is completely unexpected.
				SrfSplashed = Atmospheric Composition: Hydrogen 55%, Helium 20%, Methane 20.6%, Ammonia 4%, Water 0.3%, Chlorine 0.06%, Hydrogen Chloride 0.04%. The methane and chlorine are both vastly more abundant than models suggest they should be. Water composition: Ammonium Hydroxide: roughly 60% water, 25% ammonia, a substantial amount of formaldehyde, and traces of perchlorates and hydrogen chloride. The Formaldehyde is completely unexpected.
				SrfLanded = Atmospheric Composition: Hydrogen 55%, Helium 20%, Methane 20.6%, Ammonia 4%, Water 0.3%, Chlorine 0.06%, Hydrogen Chloride 0.04%. The methane and chlorine are both vastly more abundant than models suggest they should be.
			}
		}
	}
}
