@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = Interloper
			Values
			{
				SrfLanded = The surface is a dirty mix of ice and stony pebbles, though at these temperatures it's hard to tell the ice and the rock apart. An analysis of the isotopic ratios shows something shocking! There are trace radioisotopes in the crust that have never before been seen in nature. These radioisotopes have half lives of a few billion years, which means the Interloper can't be older than about 6 billion years old! That is much, much younger than anything else in the solar system!
				SrfLandedDeepFriedIce = The surface is mostly ice and dirt, but the dirt and organic compounds have been concentrated on the surface as the ice melted around it, making it much darker than the snowy ice we're familiar with. An analysis of the isotopic ratios shows something shocking! There are trace radioisotopes in the crust that have never before been seen in nature. These radioisotopes have half lives of a few billion years, which means the Interloper can't be older than about 6 billion years old! That is much, much younger than anything else in the solar system!
				SrfLandedSunnyBlueCrevices = The surface here is pure ice that seems to have been recently exposed. The volatile content suggests that the Interloper can't have been in orbit around the Sun for longer than 500,000 years.
				SrfLandedBlueCollapsedTerrain = The surface here is a porous cluster of essentially dirty snow, but more ice rich than the rest of the surface of the comet. The volatile content suggests that the Interloper can't have been in orbit around the Sun for longer than 500,000 years.
				SrfLandedSpikes = The spikes have very little dirt or dust on them, they seem to be a smooth, solid ice. The volatile content suggests that the Interloper can't have been in orbit around the Sun for longer than 500,000 years.
				SrfLandedCollapsedTerrain = The surface here is a rock/ice mix of large gravel-like chunks loosely packed together. An analysis of the isotopic ratios shows something shocking! There are trace radioisotopes in the crust that have never before been seen in nature. These radioisotopes have half lives of a few billion years, which means the Interloper can't be older than about 6 billion years old! That is much, much younger than anything else in the solar system!
			}
		}
	}
}
