@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = Interloper
			Values
			{
				InSpaceHigh = We're actually going to get to see a comet up close! This is fantastic!
				InSpaceLow = The Interloper is not even slightly spherical. It comprises two distinct regions: an extremely pointy jagged half with a bluish tint, and a dark brown spheroidal region with a lot of bumps and crevices.
				SrfLandedSpikes = The surface isn't remotely level here. I'm not actually sure how to keep the ship from falling over.
				SrfLandedCollapsedTerrain = The ground shakes a little as it settles beneath the ship.
				SrfLandedBlueCollapsedTerrain = The ground shakes a little as it settles beneath the ship.
				InSpaceDeepFriedIce = This hemisphere of the comet is the one that always faces the Sun at perihelion.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = Interloper
			Values
			{
				InSpaceLow = We're not gonna crash into the spikes, right?
				SrfLanded = The gravity is so low here it is actually quite difficult to walk. I'm going to have to use my jetpack to get around.
				SrfLandedSpikes = There is nowhere else in the solar system that's like this. The slopes are almost vertical, and comparable in height to the radius of the entire comet! My best guess for how this happened is that the comet was made of large chunks of ice mixed in with some pebbles of ice and snow. When the comet got captured, perhaps the more volatile ices, like the Carbon Monoxide or Methane, got boiled off, and the remaining ice and dirt fell down, and then the spikes are just what remains of the biggest chunks of regular ice.
				SrfLandedCollapsedTerrain = The surface is unstable, and kinda sinks a little every time I take a step. There seems to have been some kind of catastrophic structural collapse in this hemisphere of the comet.
				SrfLandedBlueCollapsedTerrain = The surface is unstable, and kinda sinks a little every time I take a step. There seems to have been some kind of catastrophic structural collapse in this hemisphere of the comet.
			}
		}
	}
}
