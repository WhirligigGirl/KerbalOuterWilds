@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				InSpaceHigh = The Hourglass Twins are both easily seen from here as two spheroidal objects. They orbit eachother so quickly you can almost see it happening in real time. I'm not looking forward to trying to navigate this particular gravitational gauntlet. Hey, we remembered to install the Principia integration guidance routines into the navigational computer, right? The old patched-conics solver is definitely not gonna cut it here.
				InSpaceLow = Ember Twin's surface appears to be heavily terraced. There are also what appears to be water-carved features, but there's no sign of any water!
				SrfLanded = We're down on the ground here, control. The sky and the ground are both red.
				SrfLandedHighDesert = The sky looks to be pretty dark around these parts.
				SrfLandedMesas = The sky looks to be pretty dark around these parts.
				SrfLandedSouthernMesa = The sky looks to be pretty dark around these parts.
				SrfLandedSaltFlats = The dust seems to be picking up... Something doesn't feel quite right here.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				SrfLandedSaltFlats = The dust seems to be picking up... Something doesn't feel quite right here.
				SrfLandedGrandestCanyon = The canyons here put the ones on Timber Hearth to shame. There's no glacial carving here, it's all dried up rivers. The edges of the canyons are highly terraced, must be some kind of erosional feature.
				SrfLandedNorthernCanyon = The canyons here put the ones on Timber Hearth to shame. There's no glacial carving here, it's all dried up rivers. The edges of the canyons are highly terraced, must be some kind of erosional feature.
				SrfLandedSouthernCanyon = The canyons here put the ones on Timber Hearth to shame. There's no glacial carving here, it's all dried up rivers... but I am seeing some morphology that looks almost more like a tectonic rift than a river canyon.
				SrfLandedRiftValley = There aren't so many water carved features here. I think this canyon was formed by tectonic forces, not by erosion. Unlike Timber Hearth, Ember Twin might not have a stagnant lid. There could be sideways tectonic motion as well as vertical. Which I suppose makes sense--the tides probably kept Ember Twin more geologically active for longer.
				SrfLanded = The surface around these parts is highly terraced, with erosional features that could be wind carved or water carved or, heck, could be both.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				SrfLanded = The nutrient broth is exposed to the sand sample. The sensor registers a small amount of radioactive carbon gases, but then the gas stops. A new sand sample is heated to sterilize it completely, then reintroduced to the nutrients. After a few moments, there is a small amount of radioactive carbon gases. If the radioactive gases were produced by organisms metabolizing the nutrients, then they would probably have been killed by the sterilizing heater, and the heated sample would not have had the same reaction as the unheated one. Results are not conclusive, because any life on Ember Twin would have to be capable of surviving great heat, but it's not looking good for biosignatures here.
				SrfLandedNorthernLakebed = The nutrient broth is exposed to the sand sample. The sensor registers a small but steady stream of radioactive gases--a positive biosignature. To confirm, a second sample is heated to sterilize it, then the nutrients are reintroduced. This time, there is only a minuscule amount of radioactive carbon gases detected. Next, a sample is exposed to the nutrient sample, and the gas is measured continuously. Eventually the radioactive gases die out. The nutrients are then reintroduced, and the radioactive gas signature increases. This is repeated one more time. If the sample abiotically reacted to the nutrients, then there would be no radioactive gas signature the second or third time the nutrients were reintroduced. This is strong evidence for microorganisms on Ember Twin! But how could life thrive this close to the Sun, and in this dry an environment?
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				SrfLandedSaltFlats = The surface is a bone-dry mix of silicate rock and magnesium chloride and sodium chloride salt.
				SrfLandedNorthernLakebed = The surface is a bone-dry mix of silicate rock and magnesium chloride and sodium chloride salt, but, remarkably, after digging a little deeper, you can find layers of sand which much more closely resemble the beach sand on Timber Hearth: There are clear signs of fossilized animal shells! Further analysis is required to be certain, but this strongly implies that macroscopic life has existed at one time on Ember Twin! The question is, does life still exist here?
				SrfLanded = The surface is comprised of an iron-oxide rich sedimentary rock. This can only be explained by water having once existed here.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				SrfLandedSaltFlats = The dust billows into the materials bay. Many of the samples begin to corrode.
				SrfLandedLowlands = The dust billows into the materials bay. You note how each of the materials cope with the sandblast.
				SrfLanded = You begin a careful study of the material samples' reaction to the rapid and intense thermal cycling as the Sun rises and sets. Some of the more reactive samples begin to corrode--the atmosphere here is clearly oxidizing. 
				FlyingLow = The dust billows into the materials bay. You note how each of the materials cope with the sandblast.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				InSpaceHigh = The magnetic field environment of the Hourglass Twins is a complex one, controlled by two planetary magnetic fields as well as the interplanetary magnetic field. The shape of the magnetosphere changes throughout the orbit of the twins.
				InSpaceLow = Ember Twin's magnetic field is stronger than Timber Hearth's, and highly directional, with a magnetic north pole near the north rotational axis. But it's still relatively weak as planetary magnetic fields go. Due to the higher strength of the interplanetary magnetic field at Ember Twin compared to Timber Hearth, the magnetosphere is actually smaller, and so it's likely that more solar radiation hits its atmosphere.
			}
		}
	}
}
