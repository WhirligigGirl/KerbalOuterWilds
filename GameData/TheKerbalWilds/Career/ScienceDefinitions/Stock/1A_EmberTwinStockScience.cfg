@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				SrfLanded = The sensor detects consistent low-level seismic activity, which allows for a rudimentary map of the planet's interior to be made. Ember Twin's structure is similar to Timber Hearth's, but with a relatively smaller iron core.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				InSpaceHigh = The Hourglass Twins have a remarkable gravitational arrangement. The equipotential is shaped like a dumbbell, or perhaps two eggs with the pointy sides facing eachother. Precise measurements indicate that the Hourglass Twins' orbit is slowly getting closer, most likely due to tidal influence from the Sun.
				InSpaceLow = The sensor maps the gravitational field of the Ember Twin. It is remarkably bumpy, but still averages out to being rounded. The planet is actually slightly egg shaped, with the pointy side facing the Ash Twin!
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = EmberTwin
			Values
			{
				FlyingHigh = The sensor detects carbon dioxide, oxygen, and water.
				FlyingLow = Carbon Dioxide 70%, Oxygen 18%, Steam 10%, Sulfur Dioxide 2%. Yes. That's right. OXYGEN. In roughly the same proportion as on Timber Hearth, even! Oxygen should react with surface rocks over time to form metal oxides, and eventually deplete the oxygen content in the atmosphere. So where did the oxygen come from? On Timber Hearth, it's created primarily by the trees, and partly by algae in the oceans. I see two possibilities: Either the Ember Twin had a mostly water atmosphere, and the hydrogen was split off by solar radiation and then lost, or, much more excitingly, it used to have trees or algae that created the oxygen!
			}
		}
	}
}
