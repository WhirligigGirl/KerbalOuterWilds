@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = DarkBramble
			Values
			{
				InSpaceHigh = You hate looking at it. Creepy planet. No good.
				InSpaceLowRifts = Wait... huh. The 'brambles' aren't, like, vines and thorns and stuff... they're rift valleys! But why are they so much darker than the surrounding terrain?
				InSpaceLowVines = Wait... huh. The 'brambles' aren't, like, vines and thorns and stuff... they're rift valleys! But why are they so much darker than the surrounding terrain?
				InSpaceLowThickIce = This part of the planet is distinctly more boring, but on the bright side it is also distinctly safer to land on, both in terms of slopes and creepy alien brambles.
				FlyingHigh = Please let me go back inside now.
				FlyingLow = I really hope the atmosphere is thick enough for parachutes!
				SrfLanded = Yes, I actually did manage to get over myself and get outside, thank you very much. This planet is no less eerie up close than it is through a telescope. The sky is this sickly yellow-green color. The ground is dull, and the sun is noticeably dimmer than at TimberHearth.
				SrfLandedCryovolcanoes = It's snowing! It's actually snowing! It's... oh, stars above... I just caught a piece of, uh, precipitation. This looks a lot more like a freshwater shrimp than a snowflake.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = DarkBramble
			Values
			{
				Flying = The nutrient mix is exposed to a sample of Dark Bramble's atmosphere. There are no reactions of note.
				FlyingCryovolcanoes = The nutrient mix is exposed to the cryovolcanic plume. The nutrient sample is ready consumed and tagged radioactive carbon gas is detected by the instrument. After following up with a sterilized sample, there is no activity. There's living organisms in the ice plume!
				SrfLandedVines = An ice sample is exposed to the nutrients. After a few moments, the sensor detects a faint stream of radioactive carbon gases. After following up with a sterilized sample, there is no activity. There are microorganisms living within the ice crystals!
				SrfLandedRifts = An ice sample is exposed to the nutrients. The nutrient sample is readily consumed and tagged radioactive carbon gas is detected by the instrument. After following up with a sterilized sample, there is no activity. There are microorganisms living within the ice crystals!
				SrfLandedCryovolcanoes = An ice sample is exposed to the nutrients. The nutrient sample is readily consumed and tagged radioactive carbon gas is detected by the instrument. After following up with a sterilized sample, there is no activity. There are microorganisms living within the ice crystals!
				SrfLandedThickIce = An ice sample is exposed to the nutrients. For several minutes, there is no activity, but after the sample is heated slightly, chemical reactions are detected. A followup with a sterilized sample reveals a reduced amount of reactions, which makes it unclear whether the nutrients are abiotically reacting or being biologically metabolized.
			}
		}
	}
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = DarkBramble
			Values
			{
				SrfLandedThickIce = The surface is made of ice with traces of ammonia and perchlorates.
				SrfLandedVines = The surface is primarily ice, with a high concentration of metal halide salt impurities and large amounts of perchlorates.
				SrfLandedRifts = The surface is primarily ice, with a high concentration of metal halide salt impurities and large amounts of perchlorates.
				SrfLandedCryovolcanoes = The surface is primarily ice, with a high concentration of metal halide salt impurities and large amounts of perchlorates. There are also complex little frozen patterns that, on close inspection, appear to be a kind of krill. After heating up a sample, a small bioluminescent bulb at the end of a tiny antenna flickers to life. Dark Bramble's ocean is inhabited by animal life! Really, really creepy looking animal life. You do not want to go swimming down there.
			}
		}
	}
}
