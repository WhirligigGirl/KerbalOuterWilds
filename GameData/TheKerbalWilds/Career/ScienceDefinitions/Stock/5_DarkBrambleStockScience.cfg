@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = DarkBramble
			Values
			{
				SrfLandedThickIce = There is a noticeable degree of seismic activity. A study of the activity reveals the internal structure of the planet: Beneath the ice crust lies an internal ocean, and beneath that is a mantle of more ice, kept solid by immense pressure. Then there is a small rocky core a little smaller than the Attlerock, and within that, a two-layer iron core with a molten outer layer and a solid inner layer. All of the layers beneath the ocean are not fully differentiated, they're slightly mixed up over the scale of a kilometer or so. The planet should have settled into a fully differentiated state by now. Perhaps there was a catastrophic impact that mixed everything up and made the inside warm? But there would have been a lot of debris from that impact... there would be evidence of this on other planets! We should check!
				
				SrfLanded = There is a substantial amount of seismic activity, far more than should be expected for a planet this old and far away from the Sun. A study of the activity reveals the internal structure of the planet: Beneath the ice crust lies an internal ocean, and beneath that is a mantle of more ice, kept solid by immense pressure. Then there is a small rocky core a little smaller than the Attlerock, and within that, a two-layer iron core with a molten outer layer and a solid inner layer. All of the layers beneath the ocean are not fully differentiated, they're slightly mixed up over the scale of a kilometer or so. The planet should have settled into a fully differentiated state by now. Perhaps there was a catastrophic impact that mixed everything up and made the inside warm? But there would have been a lot of debris from that impact... there would be evidence of this on other planets! We should check! Since there is so much evidence of biological processes in this region, we'd be looking for chemical signatures that match the atmospheric characteristics of this planet.
			}
		}
	}
}
