@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]:FOR[TheKerbalWilds]
{
	@RESULTS
	{
		Body
		{
			name = DarkBramble
			Values
			{
				FlyingHigh = The atmosphere is a little under half nitrogen, and about 1/5th oxygen and... 1/5th chlorine? But that's impossible, that's vastly more chlorine than there should be!
				FlyingLow = Composition: Nitrogen 44%, Oxygen 22%, Chlorine 21%, CO2 13%. The fraction of chlorine should be impossible, that's vastly more chlorine than there should be! Though it does help to describe the yellow-green sky color.
				SrfLanded = Composition: Nitrogen 44%, Oxygen 22%, Chlorine 21%, CO2 13%. The fraction of chlorine should be impossible, that's vastly more chlorine than there should be! Though it does help to describe the yellow-green sky color.
				SrfLandedGeysers = Composition: Nitrogen 44%, Oxygen 22%, Chlorine 21%, CO2 13%. The fraction of chlorine should be impossible, that's vastly more chlorine than there should be! Though it does help to describe the yellow-green sky color. With all the evidence of biology going on here, it makes you wonder if the chlorine could be the result of some biological process. Maybe the chlorine is metabolized for energy, or maybe it was split apart from saltwater for use as a defense mechanism that got kinda out of hand? Either way, there is certainly no geophysical explanation for the chlorine content that you can think of.
			}
		}
	}
}
