@PART[InfraredTelescope]
{
	@title = StarShutter Infrared Signalscope
	@description = The StarShutter Space Signalscope uses infrared light to detect astral bodies. It can be used as an astronomical instrument when deployed in high orbit around a celestial body, and can also be used to detect asteroids that may be potentially hazardous to Timber Hearth or to Travellers. The StarShutter can be used to image planets from high orbit, but if there is a scientist on the crew, they will be able to make astronomical observations as well. NOTE FROM CHERT (Property of Chert): USE IN HIGH ORBIT ONLY! The sensor needs to be ultra-cool in order to function, so it will not work in low orbit around a celestial object--radiated heat even from the coldest planets would add too much noise. Use with sun-shield pointed towards the Sun. Warranty void if the signalscope's aperture is pointed at the Sun.
	//god i hate typing "astral bodies" but it's pretty consistently how Hearthians and Nomai alike refer to celestial bodies.
	//"astral" doesn't mean astronomical! It's like, woo-woo higher plane of existence stuff!
	//Kelsey Beachum i love your writing so much but this ONE THING really gets on my nerves.
	
	@MODULE[infraredTelescope]
	{
		@experimentActionName = Image Planet in IR
		@resetActionName = Delete Planet Image
		@collectActionName = Take IR Planet Data
	}
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = infraredAstronomy
		experimentActionName = Conduct Astronomical Study
		resetActionName = Delete Astronomical Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = False
		xmitDataScalar = 0.4
		dataIsCollectable = True
		collectActionName = Take Astronomical Data
		interactionRange = 1.2
		rerunnable = True
		resettable = False
		usageReqMaskInternal = 2 //requires a scientist to be a member of the crew.
		usageReqMaskExternal = 8
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[infraredTelescope]]
{
	@title = Infrared Signalscope
	// situation bits:
	// SrfLanded = 1,
	// SrfSplashed = 2,
	// FlyingLow = 4,
	// FlyingHigh = 8,
	// InSpaceLow = 16,
	// InSpaceHigh = 32
	//Only works on surfaces and atmospheres.
	@situationMask = 0
	//@situationMask += 1
	//@situationMask += 2
	//@situationMask += 4
	//@situationMask += 8
	//@situationMask += 16
	@situationMask += 32 //only works in Space high.
	@RESULTS
	{
		SrfSplashed = Sensitive optics and sea water do not mix!
		SrfLanded = It's too hot here! This instrument is designed to be used in deep space only!
		InSpaceLow = It's too hot here! This instrument is designed to be used in high orbit only!
		InSpaceHigh = You map out the stars in infrared light.
		EmberTwinInSpaceHigh = The images come out a little grainy due to the heat, but they are usable. Ember Twin is the warmer of the two planets, with the equatorial region being counterintuitively some of the coolest parts of the planet, being about the same temperature as the Ash Twin.
		AshTwinInSpaceHigh = The sensor is too close to the Hourglass twins to cool down. All of your images come out grainy and unusable. Who thought it was a good idea to do astronomy from the hottest planets in the solar system?
		KerbinInSpaceHigh = The near-IR image shows that the High Desert is fairly dark in the infrared, which goes a long way to explaining why it doesn't just reflect away all the heat from the Sun. The thermal IR image basically looks like if someone overlaid a heightmap and a latitude gradient--the higher latitudes and altitudes are very cold, while the lower latitudes and altitudes are quite warm. Air doesn't circulate much on Timber Hearth, so there isn't much to transfer heat across the planet.
		AttlerockInSpaceHigh = The thermal IR images show a stark difference between the day and night sides of the planet, with temperature differentials in excess of 200 degrees! In the near-IR, the images of the Attlerock look almost identical to grayscale visible-light photos.
		BrittleHollowInSpaceHigh = You attempt to make an infrared scan of Brittle Hollow's surface. The near-infrared image shows a nearly 'black' planet with brilliantly white poles. The far-infrared image comes out grainy, but shows a fairly straightforward gradient of cold at the equator to VERY cold at the poles. An analysis of the graininess reveals that the sensor is unable to cool properly, due to the radiant heat from Hollow's Lantern. Bummer.
		HollowsLanternInSpaceHigh = You were explicitly warned against bringing the infrared signalscope to hot places! This place is too hot! Between the Sun and Hollow's Lantern, the infrared sensor can't cool down, which means all you can observe is noise.
		GiantsDeepInSpaceHigh = The thermal IR images suggest that Giant's Deep emits slightly more radiation than it receives from the Sun. The near IR images are blocked by the water clouds in the atmosphere.
		DarkBrambleInSpaceHigh = Thermal IR images of the planet show that the 'brambles' are crustal hot-spots.
		InterloperInSpaceHigh = Thermal IR images of the comet show extreme temperature differentials between the sunlit and shaded side of the object, but the spiky regions seem to be cooler on average.
	}
	
}
EXPERIMENT_DEFINITION
{
	title = Infrared Astronomy
	baseValue = 10
	scienceCap = 30
	dataScale = 2
	biomeMask = 0
	
	situationMask = 0
	//@situationMask += 1
	//@situationMask += 2
	//@situationMask += 4
	//@situationMask += 8
	//@situationMask += 16
	@situationMask += 32 //only works in Space high.
	RESULTS
	{
		SrfSplashed = Sensitive optics and sea water do not mix!
		SrfLanded = It's too hot here! This instrument is designed to be used in deep space only!
		InSpaceLow = It's too hot here! This instrument is designed to be used in high orbit only!
		InSpaceHigh = You map out the stars in infrared light.
		EmberTwinInSpaceHigh = You perform a survey of galactic nebulae. They appear to belong to two categories: wispy and planetary. The planetary ones are mostly round (hence the name), and seem to be enriched in 'metals' (elements other than hydrogen), while the wispy ones are even more metal-rich, but have high doppler-shifts that indicate they are expanding at a noticeable fraction of the speed of light.
		AshTwinInSpaceHigh = The sensor is too close to the Hourglass twins to cool down. All of your images come out grainy and unusable. Who thought it was a good idea to do astronomy from the hottest planets in the solar system?
		BrittleHollowInSpaceHigh = You attempt to make an infrared scan of Brittle Hollow's surface. The near-infrared image shows a nearly 'black' planet with brilliantly white poles. The far-infrared image comes out grainy, but shows a fairly straightforward gradient of cold at the equator to VERY cold at the poles. An analysis of the graininess reveals that the sensor is unable to cool properly, due to the radiant heat from Hollow's Lantern. Bummer.
		HollowsLanternInSpaceHigh = You were explicitly warned against bringing the infrared signalscope to hot places! This place is too hot! Between the Sun and Hollow's Lantern, the infrared sensor can't cool down, which means all you can observe is noise.
		KerbinInSpaceHigh = You perform an infrared survey of the sky, to attempt to answer the question of whether the star clusters are part of the galaxy, or if they are other island universes. The result: all of the nebula and clusters you've checked belong to the galaxy. The galaxy is therefore the entire universe, with nothing but void beyond it.
		SunInSpaceHigh = You make an infrared survey of the stars. Weirdly, towards the center of the galaxy, there is a field of very faint, extremely red stars. Spectral analysis reveals that these stars are the same color as normal stars, but they're doppler-shifted. The speed necessary to result in this much redshift is close to the speed of light! How did they get moving so quicky?
		BrittleHollowInSpaceHigh = Hollow's Lantern is just too hot. You can make planetary images just fine, but deep sky objects are much, much fainter, and require a much more sensitive sensor.
		GiantsDeepInSpaceHigh = You perform a survey of cold objects in the outer solar system, looking for comets, icy asteroids, or even small planets that may have been overlooked.
		DarkBrambleInSpaceHigh = Followup Measurements of High-Redshift Stars. Previous missions have imaged stars with extremely high redshifts. Your new observations focus on cepheid variable stars--stars where the time period of its variable brightening and dimming correspond directly to their average luminosity. These are used as standard candles for distance measurement. Accounting for the time dilation effect due to their extreme motion, there is a direct correlation between the distance to the star and its redshift. But this is obvious. Stars that are moving faster travel further in the same amount of time. The trouble is that the data seems to imply the stars are actually accelerating. Since there is no force powerful enough to continuously accelerate an entire star, the obvious conclusion is that there is some phenomenon other than velocity-based doppler shift that can shift the spectrum of a light source, perhaps some kind of absorption of light by interstellar gas.
		InterloperInSpaceHigh = The coma and tail of the Interloper are interfering with your measurements.
	}
	
}