@PART[GooExperiment]:FOR[TheKerbalWilds]
{
	@title = Mystery Goo™ Soil/Atmosphere BiosIgnature Nutrient Astrobiology Test Experiment
	@description = Mystery Goo™ SABINAITE is a chamber containing a soup of biochemical nutrients tagged with radioactive Carbon-14. By exposing gas and soil samples to the nutrients, the onboard sensors can detect any reaction products that indicate the nutrients were metabolized by living organisms, and hopefully probe for alien life! It also serves as a handy emergency ration for the crew! WARRANTY VOID IF USED IN THE VACUUM OF SPACE! Use in atmospheres or oceans only!
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
	// situation bits:
	// SrfLanded = 1,
	// SrfSplashed = 2,
	// FlyingLow = 4,
	// FlyingHigh = 8,
	// InSpaceLow = 16,
	// InSpaceHigh = 32
	//Only works on surfaces and atmospheres.
	%requireAtmosphere = True
	@situationMask = 0
	@situationMask += 1
	@situationMask += 2
	@situationMask += 4
	@situationMask += 8
	//@situationMask += 16 //no space
	//@situationMask += 32 //no space
	
	@RESULTS
	{
		InSpace = The sensor reads an unambiguous negative, on account of there being no sample to analyze. Also, the warranty has been voided. Use this instrument on a surface and/or atmosphere instead!
	}
	
}