@Kopernicus:HAS[@KerbalWildsSettings:HAS[#NamingScheme[Exoplanets]]]:FOR[theKerbalWildsScale]
{
	@Body:HAS[#identifier[KerbalWilds/Sun]]
	{
		@Properties
		{
			%displayName = EOTU-22A^N
			%description = Recently, a fascinating signal was discovered from this star, which has nearly an identical luminosity to the Sun, by the space program's "Eyes On The Universe" citizen science mission. It is a strong candidate for a SETI detection. What's much more peculiar, though, is that this star is a K3IV subgiant of 0.8 solar masses, at a state in its evolution that implies it is extremely old. Like, possibly older than the entire universe. This is of course almost certainly a problem with our models (how can something predate its creator?) but up-close exploration should prove fruitful. Since the EOTU SETI detection, the star has been named EOTU-22A. (EOTU-22B is of course whatever object emitted the signal.)\n\nThe star is orbited by a delightfully compact system of five exoplanets.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/EmberTwin]]
	{
		@Properties
		{
			%displayName = EOTU-22A c^N
			%description = The nearest known planet to EOTU-22A, planet c is known from radial velocity measurements to be about 0.68 Kerbin masses.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/AshTwin]]
	{
		@Properties
		{
			%displayName = EOTU-22A c B^N
			%description = Some irregularities EOTU-22A c' transit curve indicate it could be a binary planet.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/TimberHearth]]
	{
		@Properties
		{
			%displayName = EOTU-22A d^N
			%description = EOTU-22A's second planet, planet d is nearly the same mass as Kerbin. It's in the habitable zone now, but it was too cold for most of the star's lifetime. If there is any life there, it probably hasn't had time to get very big and complicated.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/Attlerock]]
	{
		@Properties
		{
			%displayName = EOTU-22A d I^N
			%description = We can't rule out the possibility of a satellite around any of these planets, but none are known yet.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/BrittleHollow]]
	{
		@Properties
		{
			%displayName = EOTU-22A e^N
			%description = EOTU-22A's third planet, planet e, is a little bit more massive than Kerbin. According to transit data, it is so much larger than Kerbin that it implies a low density, possibly even an ice-rich composition. Although there are some who have proposed, no doubt based on the famous SETI signal in this system, that the planet could be so sparse because it is hollow. Such a world would be too brittle to support itself, though, so we don't find the idea particularly plausible.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/HollowsLantern]]
	{
		@Properties
		{
			%displayName = EOTU-22A e I^N
			%description = We can't rule out the possibility of a satellite around any of these planets, but none are known yet.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/GiantsDeep]]
	{
		@Properties
		{
			%displayName = EOTU-22A b^N
			%description = EOTU-22A b, also known as ExoScan-1432212 b, was the first planet detected around EOTU-22, back before the SETI signal was found. It is around 8 Kerbin masses, implying it could be an Eve-like world.\n\nRevision: The above description has led to a lot of artist's depictions depicting EOTU-22A b as purple, but we must clarify that the high-temperature chemistry that results in Eve's peculiar hue is likely not to be present on this world. A blue-white appearance is more likely, though we can't rule out any particular color.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/DarkBramble]]
	{
		@Properties
		{
			%displayName = EOTU-22A f^N
			%description = The outermost known planet of EOTU-22A, planet f is similar in size to planet e, except substantially less massive.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/Interloper]]
	{
		@Properties
		{
			%displayName = EOTU-22A Comet 1P^N
			%description = We can't rule out the possibility of comets orbiting this star, but none are known.
		}
	}
}

@Kopernicus:HAS[@KerbalWildsSettings:HAS[#NamingScheme[Nomai]]]:FOR[theKerbalWildsScale]
{
	@Body:HAS[#identifier[KerbalWilds/Sun]]
	{
		@Properties
		{
			%displayName = Eye's Star
			%description = Idaea: The star of the system we all call home, and the source of all light and power. This star is approximately 20 billion years old and on the cusp of evolving into a red giant, a process which will take around a few tens of millions of years. We have until then to determine the source of the signal which brought our clan to this system.\n\nPye: We don't have millions of years until we pass, Idaea. We must be swifter than that.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/EmberTwin]]
	{
		@Properties
		{
			%displayName = Sunless Component
			%description = The Binary Planet is a pair of two small planets in orbit around a common center of mass close to the Eye's Star. Named for the planet's largest Nomai settlement (the Sunless City), the Sunless Component is the slightly larger of the two, and has by far the more interesting geology. It was the crash site for Escape Pod 2, and has been the home to roughly half of all Nomai in this star system ever since. It is believed, based on fossil evidence in the north polar lakebed, that the Sunless Component was once habitable when its star was dimmer.\n\nThe ferrousness of the planet's name is lost on no one.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/AshTwin]]
	{
		@Properties
		{
			%displayName = Belted Component
			%description = The Belted Component is the slightly smaller of the two components of the Binary Planet. Little is known about its geology, resulting from an apparent resurfacing event that occurred some billions of years in the past. The Belted Component is visible in the Sunless Component's sky as an enormous, almost blindingly white sphere, with a dark belt on its equator. Spectral examination confirms that the Belted Component's white regions are made of silicate rock, not unlike the sand plains on the Sunless Component.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/TimberHearth]]
	{
		@Properties
		{
			%displayName = Geyser Crater
			%description = Oeno: Geyser Crater is the second planet of this star system (presuming you count the Binary Planet as just one). It appears in telescopes to be primarily a barren world, not unlike a larger version of the Sunless Component, but close inspection reveals large impact basins with the blues, whites, and greens associated with living worlds. It is lucky that none of our escape pods landed on Geyser Crater and altered its evolution.\n\nColeus: Lucky for whom?\n\nOeno: You know perfectly well what I mean.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/Attlerock]]
	{
		@Properties
		{
			%displayName = Crater Moon
			%description = The satellite of Geyser Crater, Crater Moon lives up to its name in two ways. For one: it is a moon of Geyser Crater. For another: It is itself heavily cratered, and in fact may be the most heavily cratered astral body in this star system.
			//Yes I know the correct term is 'celestial,' the use of 'astral' pisses me off in fact, but it's very consistently how Hearthians and Nomai alike refer to celestial bodies in Outer Wilds.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/BrittleHollow]]
	{
		@Properties
		{
			%displayName = Hanging Planet
			%description = Conoy: Named for its largest city, the Hanging City above the pits of the planet's largest caverns, the Hanging Planet has been the home to roughly half of the Nomai in this star system ever since the crash of Escape Pod 1 upon its surface two hundred years ago. It is only within the past few decades, as technology has returned from a dark period, that we have been able to contact our brothers and sisters on the Binary Planet. The Hanging Planet's surface geology is barren, desolate, cold, and bone dry, but geothermal heating from the planet's terrifying moon has warmed the interior, and water flows in the caves in its poles. The caves of the equatorial regions are too unstable for permanent settlements; consequently most settlements are found in the high latitudes.\n\nSpire: It is unusual for a planet to be named for something built by Nomai, so there have also been various attempts over the years to find a more fitting name for the world.\n\nConoy: It is also unusual for Nomai to build anything permanent on a planet.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/HollowsLantern]]
	{
		@Properties
		{
			%displayName = Volcanic Moon
			%description = The Volcanic Moon is the largest satellite of the Hanging Planet, and the source of all of its other natural satellites. The Volcanic Moon goes through long dormant periods, but slight changes in the eccentricity of its orbit can result in massive buildups of internal heat and pressure, leading to months of luminous, red-orange eruptions. At periapsis, ejecta from the moon's volcanoes can actually break free of the moon's gravity, and enter an unstable orbit around the Hanging Planet. These meteoroids can wreak havoc if they collide with the planet, and are the primary reason for the instability of the equatorial regions of the Hanging Planet. If it wasn't terrifying enough, the Volcanic Moon is currently in an unexplained period of extreme activity.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/GiantsDeep]]
	{
		@Properties
		{
			%displayName = Escall's Planet
			%description = Spire: For many years, on the Hanging Planet, the massive planet was known only by its systematic designation, EOTU-22A b. But after the reunion between the Nomai living on the Hanging Planet and the Binary Planet, we became aware that the inhabitants of the Sunless City referred to the massive green world as Escall's planet, to pay homage to the original leader of our clan, who perished in the ice planet when our clan arrived here.\n\nPye: The legend goes that Escall's widow claimed many years ago that her wife's favorite color was green!\n\nSpire: I'd never heard of that!
		}
	}
	@Body:HAS[#identifier[KerbalWilds/DarkBramble]]
	{
		@Properties
		{
			%displayName = EOTU-22A f
			%description = Pye: The outermost planet in this star system, and the first to be visited by Nomai. Unfortunately it was not under pleasant circumstances. A navigational error upon our Vessel's entry into the system resulted in the loss of many good nomai deep in the planet's frigid oceans, and the crash of two of its five escape pods on other planets in the system. Much has been written about the terrors that live inside this planet's oceans, and at this point it is not certain to what degree these stories are myth or truth. But needless to say, no Nomai is particularly excited to visit this horrible world.\n\nPrivet: It is the only world in this star system which still lacks a name. Is that fair?\n\nColeus: Consider what this world has taken from our people. This horrible place will never be dignified with a name.\n\nIdaea: That's hardly a scientifically justifiable position. It's not the planet's fault we crashed there.\n\nColeus: I wouldn't be so sure.
		}
	}
	@Body:HAS[#identifier[KerbalWilds/Interloper]]
	{
		@Properties
		{
			%displayName = Comet 1I
			%description = Yarrow: A new comet has been detected entering this star system. It has been a very long time since we last explored something new, so we are excited to welcome this comet. Imagine what knowledge might be gained there!
		}
	}
}