@Kopernicus:NEEDS[Principia]:AFTER[TheKerbalWilds]
{
	//Principia won't support teleportation anyway, but also, KWwhiteHole1 has an impossible orbit.
	!Body[KWblackHole1_Kerbol]{}
	!Body[KWwhiteHole1_InterloperFocus]{}
	!Body[KWblackHole2_BH]{}
	!Body[KWwhiteHole2_Duna]{}
}
@Kopernicus:HAS[@KerbalWildsSettings:HAS[#SystemType[Replacer]]]:AFTER[TheKerbalWilds]
{
	!Body[KWblackHole1_Kerbol]{} //remove Kerbol->InterloperFocus Black Hole
	!Body[KWwhiteHole2_Duna]{} //remove BrittleHollow->Duna White Hole
	//Link BrittleHollow Black Hole to Interloper Focus White Hole
	@Body[KWblackHole2_BH]
	{
		!Wormhole{}
		Wormhole
		{
			partner = KWwhiteHole1_InterloperFocus
			influenceAltitude = 35000
			jumpMaxAltitude = 30000
			jumpMinAltitude = 10
			entryMessage = ENTERING EVENT HORIZON
			exitMessage = LEAVING WHITE HOLE
			entryMsgDuration = 20
			exitMsgDuration = 10
			heatRate = 0.01
		}
	}
	@Body[KWwhiteHole1_InterloperFocus]
	{
		@Properties
		{
			%selectable = False
		}
		@Orbit
		{
			@icon = None
		}
	}
}
