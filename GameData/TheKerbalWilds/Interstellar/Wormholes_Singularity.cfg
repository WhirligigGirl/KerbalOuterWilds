Singularity
{
    //The apparent radius of the event horizon will be around 30000 x sqrt(gravity), in meters.
	//the kerbol ends of each object are 10000m, but the KW ends are 25000m by default and will need to be rescaled by the rescale patches. 
	//Since Interstellar is intended for use with KSP scale only, let's just use 10,000m radius.
	//gravity = 1/9 = 0.1111111...
	//we don't use wormholeTarget, because these are black and white holes.
	Singularity_object
    {
        name = KWblackHole1_Kerbol
		gravity = 1
		hideCelestialBody = True
		scaleEnclosingMesh = 1
    }
	Singularity_object
    {
        name = KWwhiteHole1_InterloperFocus
		gravity = -0.111111111
		hideCelestialBody = False
		scaleEnclosingMesh = 1
    }
	Singularity_object
    {
        name = KWblackHole2_BH
		gravity = 1
		hideCelestialBody = True
		scaleEnclosingMesh = 1
    }
	Singularity_object
    {
        name = KWwhiteHole2_Duna
		gravity = -0.111111111
		hideCelestialBody = False
		scaleEnclosingMesh = 1
    }
}