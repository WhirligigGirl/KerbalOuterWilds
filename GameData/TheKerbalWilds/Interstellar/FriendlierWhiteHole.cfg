@Kopernicus:HAS[@KerbalWildsSettings:HAS[#FriendlierWhiteHole[True]]]:AFTER[TheKerbalWilds]
{
	@Body[KWwhiteHole1_InterloperFocus]
	{
		@Orbit
		{
			@semiMajorAxis = 149597870700
			@semiMajorAxis *= 0.25 //quarter scale
			@semiMajorAxis *= 0.97597 //timber hearth orbit in earth-au
			@semiMajorAxis *= 1.54150791 //interloper orbit / timber hearth orbit
			@semiMajorAxis *= 0.819375132 //ratio between interloper SMA and interfocal distance.
			@semiMajorAxis *= 2
			!period = *
			@eccentricity = 0
			@inclination = 0
		}
	}
}