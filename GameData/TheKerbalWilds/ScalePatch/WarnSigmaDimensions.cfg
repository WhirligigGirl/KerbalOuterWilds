	@title = Uninstall Sigma Dimensions!
	@description = Kerbal Wilds is not compatible with Sigma Dimensions. Please uninstall Sigma Dimensions and use the file in GameData/TheKerbalWilds/SETTINGS.cfg to set your system scale. \n\nIf you are an advanced user and are sure you know what you are doing, you can find and remove this warning in GameData/TheKerbalWilds/ScalePatch/WarnSigmaDimensions.cfg. But I will not provide any support if you choose to do so. If you see this warning without Sigma Dimensions installed, let me know.
}
