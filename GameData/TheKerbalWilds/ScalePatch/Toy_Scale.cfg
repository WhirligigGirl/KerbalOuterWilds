@EVE_CLOUDS:HAS[@KerbalWildsSettings:HAS[#Scale[Toy]]]:FOR[theKerbalWildsScale]
{
	@OBJECT:HAS[#KerbalWilds[True]]
	{
		@altitude *= 0.1
		@speed[*] *= 0.182574186
		@detailSpeed[*] *= 0.182574186
		@settings
		{
			@_speed *= 0.182574186
			@_flowSpeed *= 0.182574186
			@_DetailDist *= 0.0333333333
			@_FlowMap
			{
				@speed *= 5.47722557
			}
		}
		
		@layerRaymarchedVolumeV5
		{
			@scaledFadeStartAltitude *= 0.06666
			@scaledFadeEndAltitude *= 0.06666
			@cloudTypes
			{
				@Item,*
				{
					@minAltitude *= 0.11
					@maxAltitude *= 0.11
					@baseNoiseTiling *= 0.11
				}
			}
			// @raymarchingSettings
			// {
				// @lightMarchDistance *= 0.11
				// @continuousAccumulationDistance *= 0.11
			// }
		}
	}
}
@EVE_CLOUDS:HAS[@KerbalWildsSettings:HAS[#Scale[Toy]]]:AFTER[theKerbalWildsScale]
