@Kopernicus:HAS[@KerbalWildsSettings:HAS[#Scale[Toy]]]:FOR[theKerbalWildsScale]
{
	
	@Body:HAS[#KerbalWilds[True]]
	{
		cacheFileTemp = TheKerbalWilds/KopernicusFiles/Cache/ToyScaleCaches
		@cacheFile = #$cacheFileTemp$/$name$.bin
		@Properties
		{
			@radius *= 0.0333333333 //=(1/120)/(1/4)
			@gravParameter *= 0.00111111111
			@mass *= 0.00111111111
			@rotationPeriod *= 0.182574186
			@sphereOfInfluence *= 0.0333333333
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 0.11
				@spaceAltitudeThreshold *= 0.0333333333
			}
			
		}
		@Atmosphere:HAS[~enabled[False]]
		{
			@maxAltitude *= 0.11 //= 20/125
			@altitude *= 0.11
			@atmosphereDepth *= 0.11

			
			@pressureCurve
			{
				@key,* ^= :	: :
				
				@key,* ^= :$: 0 0 0 x:
				
				@key,*[0, ] *= 0.15 //20/80
				@key,*[2, ] /= 0.15
				@key,*[3, ] /= 0.15
				
				@key,* ^= : 0 0 0 x$: :
			}
			
			@temperatureCurve
			{
				@key,* ^= :	: :
				
				@key,* ^= :$: 0 0 0 x:
				
				@key,*[0, ] *= 0.15
				@key,*[2, ] /= 0.15
				@key,*[3, ] /= 0.15
				
				@key,* ^= : 0 0 0 x$: :
			}
			
			@temperatureSunMultCurve
			{
				@key,* ^= :	: :
				
				@key,* ^= :$: 0 0 0 x:
				
				@key,*[0, ] *= 0.15
				@key,*[2, ] /= 0.15
				@key,*[3, ] /= 0.15
				
				@key,* ^= : 0 0 0 x$: :
			}
		}
		@Atmosphere:HAS[~addAFG[False],~enabled[False]]
		{
			@AtmosphereFromGround:HAS[#outerRadius[*]]
			{
				@outerRadius /= #$../../Properties/radius$
				&outerRadiusMult = #$outerRadius$
				!outerRadius,* = DEL
			}
			%AtmosphereFromGround
			{
				&outerRadiusMult = 1.025
			}
			@AtmosphereFromGround:HAS[#innerRadius[*]]
			{
				@innerRadius /= #$../../Properties/radius$
				@innerRadius /= #$outerRadiusMult$
				&innerRadiusMult = #$innerRadius$
				!innerRadius,* = DEL
			}
			%AtmosphereFromGround
			{
				&innerRadiusMult = 0.975
			}
			@AtmosphereFromGround:HAS[#transformScale[*]]
			{
				@transformScale ^= : ::
				@transformScale ^= :	::
			}
			@AtmosphereFromGround:HAS[#transformScale[0,0,0]]
			{
				%removeAFG = True
			}
			@AtmosphereFromGround:HAS[~removeAFG[True]]
			{
				@innerRadiusMult *= #$outerRadiusMult$
				@innerRadiusMult -= 1
				@innerRadiusMult *= 0.11
				@innerRadiusMult += 1
				
				@outerRadiusMult -= 1
				@outerRadiusMult *= 0.11
				%transformScale = #$outerRadiusMult$
				@outerRadiusMult += 1
				
				@innerRadiusMult /= #$outerRadiusMult$
				
				@transformScale *= 2
				@transformScale *= #$../../Properties/radius$
				@transformScale *= 0.0333333333
			}
			@AtmosphereFromGround:HAS[#transformScale[<7500],~removeAFG[True]]
			{
				@transformScale = 7500
			}
			@AtmosphereFromGround:HAS[~removeAFG[True]]
			{
				@transformScale /= #$../../Properties/radius$
				@transformScale /= 0.0333333333
				@transformScale += 1
				@transformScale = #$transformScale$,$transformScale$,$transformScale$
			}
			@AtmosphereFromGround:HAS[#removeAFG[True]]
			{
				%transformScale = 0,0,0
				!removeAFG = DEL
			}
		}
		@Orbit
		{
			@semiMajorAxis *= 0.0333333333
		}
		@ScaledVersion
		{
			@fadeStart *= 0.2
			@fadeEnd *= 0.2
			@Light
			{
				@sunAU *= 0.0333333333
				@IntensityCurve
				{
					@key,* ^= :\s+: :
					@key,*[0, ] *= 0.0333333333
					@key,*[2, ] /= 0.0333333333
					@key,*[3, ] /= 0.0333333333
				}
				@IVAIntensityCurve
				{
					@key,* ^= :\s+: :
					@key,*[0, ] *= 0.0333333333
					@key,*[2, ] /= 0.0333333333
					@key,*[3, ] /= 0.0333333333
				}
				@ScaledIntensityCurve
				{
					@key,* ^= :\s+: :
					@key,*[0, ] *= 0.0333333333
					@key,*[2, ] /= 0.0333333333
					@key,*[3, ] /= 0.0333333333
				}
			}
		}
		@PQS
		{
			@fadeStart *= 0.2
			@fadeEnd *= 0.2
			@deactivateAltitude *= 0.2
			@maxLevel -= 3
			@Mods
			{
				@LandControl,*
				{
					@vHeightMax *= 0.0666666666
				}
				@FlattenOcean,*
				{
					@oceanRadius  *= 0.0666666666
				}
				@VertexHeightOffset,*
				{
					@offset *= 0.0666666666
				}
				@VertexHeightMap,*
				{
					@deformity *= 0.0666666666
					@offset *= 0.0666666666
				}
				@VertexMitchellNetravaliHeightMap,*
				{
					@deformity *= 0.0666666666
					@offset *= 0.0666666666
				}
				@VertexHeightNoiseVertHeightCurve2,*
				{
					@deformity *= 0.0666666666
				}
				@VertexHeightNoiseVertHeight,*
				{
					@deformity *= 0.0666666666
				}
				@VertexRidgedAltitudeCurve,*
				{
					@deformity *= 0.0666666666
				}
				@VertexHeightNoise,*
				{
					@deformity *= 0.0666666666
				}
				@VertexHeightOffset,*
				{
					@deformity *= 0.0666666666
				}
				@VertexPlanet,*
				{
					@deformity *= 0.0666666666
				}
				@VertexSimplexHeightAbsolute,*
				{
					@deformity *= 0.0666666666
				}
				@VertexSimplexHeight,*
				{
					@deformity *= 0.0666666666
				}
				@VoronoiCraters,*
				{
					@deformation *= 0.0666666666
				}
				@VertexVoronoi,*
				{
					@deformation *= 0.0666666666
				}


				@FlattenOceanRegional,*
				{
					@Mod
					{
						@oceanRadius  *= 0.0666666666
					}
				}
				@VertexHeightOffsetRegional,*
				{
					@Mod
					{
						@offset *= 0.0666666666
					}
				}
				@VertexHeightMapRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
						@offset *= 0.0666666666
					}
				}
				@VertexMitchellNetravaliHeightMapRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
						@offset *= 0.0666666666
					}
				}
				@VertexHeightNoiseVertHeightRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VertexHeightNoiseVertHeightCurve2Regional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VertexRidgedAltitudeCurveRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VertexHeightNoiseRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VertexHeightOffsetRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VertexPlanetRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VertexSimplexHeightAbsoluteRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VertexSimplexHeightRegional,*
				{
					@Mod
					{
						@deformity *= 0.0666666666
					}
				}
				@VoronoiCratersRegional,*
				{
					@Mod
					{
						@deformation *= 0.0666666666
					}
				}
				@VertexVoronoiRegional,*
				{
					@Mod
					{
						@deformation *= 0.05555555555
					}
				}

				@VertexHeightOblateAdvanced
				{
					@radius *= 0.03333333333
					@mass *= 0.00111111111
					@period *= 0.182574186
				}
			}
		}
		
	}
}
