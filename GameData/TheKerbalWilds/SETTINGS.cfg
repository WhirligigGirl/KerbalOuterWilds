KerbalWildsSettings
{
	NamingScheme = Hearthian
	//Defaults to "Hearthian"
	//Options: "Exoplanets", "Hearthian", "Nomai"
	//Only affects names and descriptions, not science definitions.
	//Hearthian: Names and descriptions will be based on the names given in the original game, as given by the inhabitants of Timber Hearth.
	//Exoplanets: Names and descriptions will follow systematic standards in use for exoplanets. Use alongside SystemType = Interstellar, or to role-play as Kerbals from Kerbin, first generation Nomai, or any other alien species.
	//Nomai: Speculative names of the planets according to the Nomai.
	    //WARNING: Nomai naming scheme contains spoilers for Outer Wilds' plot 
		//(and recall that OW's entire progression is based on player knowledge, 
		//so story spoilers also ruin the actual gameplay), so please do not use 
		//the "Nomai" option until after you have finished Outer Wilds!
	
	//READ CAREFULLY!
	SystemType = Replacer
	//Defaults to "Replacer"
	//Set to "Replacer" or "Interstellar"
	//
	//Replacer: Outer Wilds solar system will replace the stock Kerbol system.
	//Interstellar: Outer Wilds solar system will be added as an interstellar destination orbiting Kerbol.
	//For Interstellar mode, it is recommended you remove the folder GameData/TheKerbalWilds/TextureReplacer 
	//  in order to disable the Hearthian kerbal textures and custom skybox.
	//Rescale patch only works on Kerbal Wilds planets, so for best results, set Scale = KSP.
	//Principia is only supported for Replacer mode.
	
	
	//READ CAREFULLY!
	Scale = KSP
	//Defaults to "KSP"
	//Set to "RSS" (1:1), "Quarter" (1:4), "KSP" (1:10), or "Toy" (1:120) (Do not use quotation marks.)
	//Sets the size of the entire solar system.
	//When changing to or from "Toy" mode, read its description below thoroughly.
	//When using "SystemType = Interstellar", you must set "Scale = KSP".
	//Options:
	//
	//	RSS:	Real Solar System scale. (1:1)
	//			Notes:  Most realistic scale, with real gravity and density. 
	//				Terrain's kind flat and boring though.
	//			Scale: 10x Stock KSP, 4x Quarter Scale.
	//			Timber Hearth: 6,000km radius, about the size of Earth.
	//			Planet Sizes: 27,000x Outer Wilds.
	//			Planet Orbits: ~17,000,000x Outer Wilds.
	//			Moon Orbits: 120,000x Outer Wilds.
	//			Day Length: 24 Hours.
	//			Delta-v: ~3.2x Stock KSP.
	//			TH Atmosphere: 114km altitude.
	//
	//	Quarter: Quarter Scale. (1:4)
	//			Notes:  Mod was originally built at this scale, so terrain looks best here.
	//				Same scale as Kitten Space Agency. 1/4th of RSS. 2.5x Stock KSP.
	//				Good for historical stockalike mods like BDB, Tantares, and SOCK, 
	//				as well as more realistic looking stock rockets.
	//			Scale: 0.25 of RSS scale, 2.5x stock KSP scale. 
	//			Timber Hearth: 1,500km radius, a little smaller than the Moon in RSS.
	//			Planet Sizes: 6,000x Outer Wilds
	//			Planet Orbits: ~4,200,000x Outer Wilds
	//			Moon Orbits: 30,000x Outer Wilds
	//			Day Length: 12 Hours.
	//			Delta-v: ~1.6x Stock KSP, 1/2x RSS.
	//			TH Atmosphere: 90km altitude.
	//
	//	KSP:	Stock Kerbal Space Program scale. (1:10)
	//			Notes:  Default setting.
	//				Slightly steeper terrain.
	//				Stock players will be most comfortable here. 
	//				(But remember Attlerock is nearly twice Mun's gravity)
	//			Scale: 0.1 of RSS scale. 0.4 of Quarter.
	//			Timber Hearth: 600km radius, same as Kerbin. 
	//			Planet Sizes: 2,700x Outer Wilds.
	//			Planet Orbits: ~1,700,000x Outer Wilds.
	//			Moon Orbits: 12,000x Outer Wilds
	//			Day Length: 6 Hours.
	//			Delta-v: Same as stock. Roughly 0.32x RSS, 0.625x Quarter Scale.
	//			TH Atmosphere: 75km altitude.
	//
	//	Toy:	Toy solar system scale. (1:120)
	//			READ CAREFULLY:
	//				Please also go into the main settings menu, under Graphics settings, 
	//				and change the Terrain Detail up to the setting called "KerbalWildsToyScale" 
	//				You will have to restart the game after doing this. 
	//				This is crucial when changing between Toy scale and anything else.
	//				When setting back to a different scale, you can return to a stock terrain detail setting.
	//			Notes:  Terrain can be slightly janky, especially with collisions on Kerbin.
	//				Extremely easy mode. If you want to do a 'serious' playthrough I recommend 
	//				installing mods and using game settings to make the game more difficult.
	//				Fun fact: This is the same as "TT scale" model trains.
	//			Scale: 1/120th of RSS scale. 1/30th of Quarter. 1/12th of Stock.
	//			Timber Hearth: 50km radius, a little smaller than Minmus. 
	//			Planet Sizes: 200x Outer Wilds.
	//			Planet Orbits: 35,000 Outer Wilds (Compared to the other scales, this is 4 times closer together.)
	//			Moon Orbits: 500x Outer Wilds (Compared to the other scales, this 2 times closer together.)
	//			Day Length: 2 Hours.
	//			Delta-v: 0.289x stock. 0.091x RSS. 0.183x Quarter.
	//			TH Atmosphere: 12.54 kilometers altitude.
	//
	//Note: 	The Scale setting ONLY sets the size of Kerbal Wilds planets. I.e., other planet mods will have their original scale. Therefore if you are an advanced user (or you're future me) and you are custom-making a compatibility patch with the stock system or with other mods, set it to KSP mode and then rescale everything else from there.
	//Note 2: 	Kerbal Wilds is NOT compatible with Sigma Dimensions since the
	//		latter does not correctly handle VertexMitchellNetravaliHeightMap.
}