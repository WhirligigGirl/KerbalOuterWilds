	//			Delta-v: Same as stock. Roughly 0.32x RSS, 0.625x Quarter Scale.
	//			TH Atmosphere: 75km altitude.
	//
	//	Toy:	Toy solar system scale. (1:120)
	//			Terrain Detail setting: KerbalWildsToyScale
	//			Notes:  Terrain can be slightly janky, especially with collisions on Kerbin.
	//				Extremely easy mode. If you want to do a 'serious' playthrough I recommend 
	//				installing mods and using game settings to make the game more difficult.
	//				Fun fact: This is the same as "TT scale" model trains.
	//			Scale: 1/120th of RSS scale. 1/30th of Quarter. 1/12th of Stock.
	//			Timber Hearth: 50km radius, a little smaller than Minmus. 
	//			Planet Sizes: 200x Outer Wilds.
	//			Planet Orbits: 35,000 Outer Wilds (Compared to the other scales, this is 4 times closer together.)
