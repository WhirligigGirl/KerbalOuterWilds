	//			Moon Orbits: 120,000x Outer Wilds.
	//			Day Length: 24 Hours.
	//			Delta-v: ~3.2x Stock KSP.
	//			TH Atmosphere: 114km altitude.
	//
	//	Quarter: Quarter Scale. (1:4)
	//			Terrain Detail setting: KerbalWildsQuarterScale
	//			Notes:  Mod was originally built at this scale, so terrain looks best here.
	//				Same scale as Kitten Space Agency. 1/4th of RSS. 2.5x Stock KSP.
	//				Good for historical stockalike mods like BDB, Tantares, and SOCK, 
	//				as well as more realistic looking stock rockets.
	//			Scale: 0.25 of RSS scale, 2.5x stock KSP scale. 
