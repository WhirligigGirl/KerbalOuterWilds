KerbalWildsSettings
{
	//READ CAREFULLY!
	Scale = KSP
	//
	//Defaults to "KSP"
	//Set to "RSS" (1:1), "Quarter" (1:4), "KSP" (1:10), or "Toy" (1:120) (Do not use quotation marks.)
	//Sets the size of the entire solar system.
	//Please also go into the main settings menu, under Graphics settings, and change the Terrain Detail up to the setting with a name that matches your rescale choice. You may also have to restart the game after doing this. This is crucial when changing between Toy scale and anything else, but is optional for the other scales.
	//Options:
	//
	//	RSS:	Real Solar System scale. (1:1)
	//			Terrain Detail setting: KerbalWildsRSSscale
	//			Notes:  Most realistic scale, with real gravity and density. 
