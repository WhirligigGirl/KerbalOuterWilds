{
	Scale = Quarter
	//Defaults to "Quarter"
	//Sets the size of the solar system.
	//RSS: Timber Hearth is 6,000km radius, about the size of Earth. 27,000x Outer Wilds. ~3.2x delta-v compared to stock.
	//Quarter: Timber Hearth is 1,500km radius. 2.5x Kerbin, 1/4x Earth. 6,000x Outer Wilds. ~1.6x delta-v compared to stock.
	//KSP: Timber Hearth is 600km radius, the same size as Kerbin. 2,700x Outer Wilds. Similar delta-v compared to stock.
	//Toy: Timber Hearth is 50km radius, a little smaller than Minmus. 200x Outer Wilds. ~1/3x delta-v compared to stock.
	//fun fact: Relative to RSS scale, toy scale is equal to the TT scale of model trains.
	
	//SystemReplacer = True
	//Defaults to "True"
